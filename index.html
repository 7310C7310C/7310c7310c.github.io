    <meta charset="UTF-8">

    <title>复活计划乐队</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans', 'Roboto', 'Arial';
        }
        
        body {
            background-color: #f5f1e8;
            color: #5a4a3a;
            min-height: 100vh;
            transition: background-color 0.3s;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 主界面样式 */
        #main-view {
            display: block;
        }
        
        .main-title {
            text-align: center;
            margin: 30px 0 20px;
            font-size: 2.5rem;
            color: #8c6a4d;
            letter-spacing: 2px;
        }
        
        .categories-list {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 10px;
        }
        
        .category-card {
            background-color: #e8dfd3;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
            padding-bottom: 15px;
        }
        
        .category-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .category-card h2 {
            margin-bottom: 10px;
            color: #6b4f3b;
        }
        
        /* 确保按钮和 div 表现一致 */
        button.category-card {
            border: none; /* 去掉默认边框 */
            width: 100%; /* 和分类卡片一样宽 */
            font-family: inherit; /* 继承字体 */
            font-size: inherit; /* 继承字号 */
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            margin-bottom: 15px; /* 和分类卡片一样的间距 */
        }
        
        /* 只覆盖本周歌曲按钮的背景色 */
        #weeklyButton.category-card {
            background-color: #c1b1a375; /* 略深的颜色 */
        }
        
        /* 分类界面样式 */
        #category-view {
            display: none;
        }
        
        /* 本周歌曲界面样式 */
        #weekly-view {
            display: none;
        }
        
        .back-button {
            background-color: #d4c8b8;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            margin-bottom: 30px;
            cursor: pointer;
            font-size: 1rem;
            color: #5a4a3a;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        #categoryTitle, #weeklyTitle {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.8rem;
            color: #8c6a4d;
        }
        
        .update-date {
            text-align: center;
            margin-bottom: 20px;
            color: #8c6a4d;
            font-style: italic;
        }
        
        .songs-list {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 0 20px;
        }
        
        .song-item {
            background-color: #e8dfd3;
            padding: 15px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            margin-bottom: 12px;
            padding-bottom: 12px;
        }
        
        .song-item:hover {
            background-color: #d9cdbc;
        }
        
        .song-number {
            font-weight: bold;
            margin-right: 15px;
            color: #8c6a4d;
            min-width: 35px;
        }
        
        .song-category {
            background-color: #8c6a4d;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 15px;
        }
        
        /* 乐谱查看器样式 */
        #viewer-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            z-index: 100;
            flex-direction: column;
        }
        
        .viewer-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow-y: auto;
            padding: 0;
        }
        
        .sheet-container {
            position: relative;
            max-width: 800px;
            margin: 0;
        }
        
        .sheet-image {
            display: block;
            transition: all 0.3s ease;
            width: 100%;
            height: auto;
            max-width: 100%;
        }
        
        /* 页码指示器和版本按钮容器 */
        .page-controls-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            z-index: 110;
        }
        
        .version-toggle-button {
            background-color: rgba(0,0,0,0.5);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 20px 0 0 20px;
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.2s;
            height: 32px;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }
        
        .version-toggle-button:hover {
            opacity: 1;
            background-color: rgba(0,0,0,0.7);
        }
        
        .version-toggle-button .arrow {
            margin-left: 5px;
            transition: transform 0.2s;
            font-size: 0.8rem;
        }
        
        .page-indicator-container {
            display: flex;
            align-items: center;
            background-color: rgba(0,0,0,0.5);
            border-radius: 0 20px 20px 0;
            padding: 5px 10px;
            height: 32px;
        }
        
        .page-nav {
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.7;
            padding: 0 8px;
            user-select: none;
        }
        
        .page-nav:hover {
            opacity: 1;
        }
        
        .page-indicator {
            color: white;
            text-align: center;
            padding: 0 10px;
            font-size: 0.9rem;
        }
        
        .version-buttons {
            position: absolute;
            bottom: 40px;
            left: 0;
            display: none;
            flex-direction: column;
            gap: 5px;
            background-color: rgba(0,0,0,0.7);
            border-radius: 8px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 120;
        }
        
        .version-buttons.show {
            display: flex;
        }
        
        .version-button {
            background-color: transparent;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
            text-align: left;
            white-space: nowrap;
            font-size: 0.9rem;
        }
        
        .version-button:hover {
            opacity: 1;
            background-color: rgba(255,255,255,0.1);
        }
        
        .version-button.active {
            opacity: 1;
            background-color: rgba(140, 106, 77, 0.7);
        }
        
        .close-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0,0,0,0.5);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 110;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        
        .close-button:hover {
            opacity: 1;
            background-color: rgba(0,0,0,0.7);
        }
        
        /* 优先显示选项 */
        .version-select {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #d4c8b8;
            background-color: #f5f1e8;
            color: #5a4a3a;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .version-select:hover {
            border-color: #8c6a4d;
        }
        
        .version-select:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(140, 106, 77, 0.2);
        }
        
        .version-preference {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
            gap: 10px;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-title {
                font-size: 2rem;
                margin: 20px 0 30px;
            }
            
            .category-card {
                padding: 20px;
            }
            
            #categoryTitle, #weeklyTitle {
                font-size: 1.5rem;
                margin-bottom: 25px;
            }
            
            .close-button {
                width: 35px;
                height: 35px;
                font-size: 1.2rem;
            }
            
            .version-toggle-button {
                font-size: 0.8rem;
                padding: 5px 8px;
            }
            
            .page-indicator {
                font-size: 0.8rem;
            }
            
            .song-category {
                margin-right: 10px;
                font-size: 0.7rem;
            }

            .loading-indicator {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: white;
                font-size: 1.2rem;
                z-index: 105;
                display: none;
                text-align: center;
                width: 100%;
                max-width: 200px;
                pointer-events: none;
            }

            .loading-spinner {
                border: 4px solid rgba(255, 255, 255, 0.3);
                border-radius: 50%;
                border-top: 4px solid white;
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
                margin: 0 auto 10px;
            }

            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }

            /* 在查看器背景上添加半透明遮罩 */
            .loading-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.7);
                z-index: 104;
                display: none;
            }
        }
    </style>
</head>

    <!-- 主界面 -->
    <div id="main-view" class="container">
        <h1 class="main-title">复活计划乐队</h1>
        
        <div class="version-preference" id="versionPreference">
            <span>优先显示：</span>
            <select class="version-select" id="versionSelect">
                <!-- 选项将通过JS动态加载 -->
            </select>
        </div>
        
        <button class="category-card" id="weeklyButton">
            <h2 style="margin: 0;">本周歌曲</h2>
        </button>
        
        <div class="categories-list" id="categoriesContainer">
            <!-- 分类将通过JS动态加载 -->
        </div>
    </div>
    
    <!-- 分类界面 -->
    <div id="category-view" class="container">
        <button class="back-button" id="backButton">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            返回
        </button>
        <h2 id="categoryTitle"></h2>
        <div class="songs-list" id="songsContainer">
            <!-- 歌曲列表将通过JS动态加载 -->
        </div>
    </div>
    
    <!-- 本周歌曲界面 -->
    <div id="weekly-view" class="container">
        <button class="back-button" id="backButtonWeekly">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <h2 id="weeklyTitle">本周歌曲</h2>
        <div class="update-date" id="updateDate"></div>
        <div class="songs-list" id="weeklySongsContainer">
            <!-- 本周歌曲列表将通过JS动态加载 -->
        </div>
    </div>
    
    <!-- 乐谱查看器 -->
    <div id="viewer-view">
        <button class="close-button" id="close-viewer">×</button>
        <div class="viewer-content" id="viewerContent">
            <div class="sheet-container">
                <img id="sheet-image" class="sheet-image" src="" alt="乐谱">
            </div>
        </div>
        
        <!-- 新版版本切换按钮和页码指示器 -->
        <div class="page-controls-container">
            <button class="version-toggle-button" id="versionToggleButton">
                <span id="versionButtonText">版本</span>
                <span class="arrow">▼</span>
            </button>
            <div class="version-buttons" id="versionButtons">
                <!-- 版本切换按钮将通过JS动态加载 -->
            </div>
            <div class="page-indicator-container">
                <div class="page-nav" id="prev-page">‹</div>
                <div class="page-indicator" id="page-indicator">1 / 1</div>
                <div class="page-nav" id="next-page">›</div>
            </div>
        </div>
    </div>
    
    <div class="loading-overlay" id="loadingOverlay"></div>
    <div class="loading-indicator" id="loadingIndicator">
        <div class="loading-spinner"></div>
        <div>加载中……</div>
    </div>

        // 当前状态
        let currentState = {
            currentCategory: null,
            currentSong: null,
            currentPage: 1,
            totalPages: 1,
            currentVersion: "原谱",
            preferredVersion: "原谱",
            availableVersions: []
        };

        // DOM元素
        const mainView = document.getElementById('main-view');
        const categoryView = document.getElementById('category-view');
        const weeklyView = document.getElementById('weekly-view');
        const viewerView = document.getElementById('viewer-view');
        const viewerContent = document.getElementById('viewerContent');
        const categoriesContainer = document.getElementById('categoriesContainer');
        const categoryTitle = document.getElementById('categoryTitle');
        const weeklyTitle = document.getElementById('weeklyTitle');
        const updateDate = document.getElementById('updateDate');
        const songsContainer = document.getElementById('songsContainer');
        const weeklySongsContainer = document.getElementById('weeklySongsContainer');
        const backButton = document.getElementById('backButton');
        const backButtonWeekly = document.getElementById('backButtonWeekly');
        const closeViewerButton = document.getElementById('close-viewer');
        const sheetImage = document.getElementById('sheet-image');
        const prevPageButton = document.getElementById('prev-page');
        const nextPageButton = document.getElementById('next-page');
        const pageIndicator = document.getElementById('page-indicator');
        const versionButtonsContainer = document.getElementById('versionButtons');
        const versionToggleButton = document.getElementById('versionToggleButton');
        const versionButtonText = document.getElementById('versionButtonText');
        const versionPreferenceContainer = document.getElementById('versionPreference');
        const weeklyButton = document.getElementById('weeklyButton');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingIndicator = document.getElementById('loadingIndicator');

        // 初始化应用
        function initApp() {
            // 初始添加一个历史记录
            history.replaceState(null, null);
            
            renderCategories();
            renderVersionPreference();
            setupEventListeners();
            
            loadingOverlay.style.display = 'none';
            loadingIndicator.style.display = 'none';
        }

        // 渲染分类列表
        function renderCategories() {
            categoriesContainer.innerHTML = '';
            songsData.categories.forEach(category => {
                const categoryElement = document.createElement('div');
                categoryElement.className = 'category-card';
                categoryElement.innerHTML = `
                    <h2>${category.name}</h2>
                    <p>${category.songs.length} 首歌曲</p>
                `;
                categoryElement.addEventListener('click', () => showCategory(category.name));
                categoriesContainer.appendChild(categoryElement);
            });
        }

        // 渲染版本偏好选项
        function renderVersionPreference() {
            // 收集所有可用的版本
            const allVersions = new Set();
            songsData.categories.forEach(category => {
                category.songs.forEach(song => {
                    song.versions.forEach(version => {
                        allVersions.add(version);
                    });
                });
            });
            
            const versionSelect = document.getElementById('versionSelect');
            versionSelect.innerHTML = '';
            
            // 添加原谱选项
            const originalOption = document.createElement('option');
            originalOption.value = "原谱";
            originalOption.textContent = "原谱";
            originalOption.selected = currentState.preferredVersion === '原谱';
            versionSelect.appendChild(originalOption);
            
            // 添加其他版本选项
            Array.from(allVersions).forEach(version => {
                const option = document.createElement('option');
                option.value = version;
                option.textContent = version;
                option.selected = currentState.preferredVersion === version;
                versionSelect.appendChild(option);
            });
            
            // 添加事件监听
            versionSelect.addEventListener('change', () => {
                currentState.preferredVersion = versionSelect.value;
            });
        }

        // 显示分类下的歌曲
        function showCategory(categoryName) {
            const category = songsData.categories.find(c => c.name === categoryName);
            if (!category) return;

            currentState.currentCategory = categoryName;
            categoryTitle.textContent = categoryName;
            songsContainer.innerHTML = '';

            category.songs.forEach((song) => {
                const songElement = document.createElement('div');
                songElement.className = 'song-item';
                // 直接使用歌曲的ID作为序号（已经是三位数）
                songElement.innerHTML = `
                    <div class="song-number">${song.id}</div>
                    <div class="song-title">${song.title}</div>
                `;
                songElement.addEventListener('click', () => showSong(categoryName, song));
                songsContainer.appendChild(songElement);
            });

            mainView.style.display = 'none';
            categoryView.style.display = 'block';
        }

        // 显示本周歌曲
        function showWeeklySongs() {
            currentState.openedFrom = null;
            updateDate.textContent = `更新日期：${songsData.weeklySongs.updateDate}`;
            weeklySongsContainer.innerHTML = '';
            
            songsData.weeklySongs.songs.forEach((song, index) => {
                // 查找完整的歌曲信息
                const category = songsData.categories.find(c => c.name === song.category);
                if (!category) return;
                
                const fullSong = category.songs.find(s => s.id === song.id);
                if (!fullSong) return;
                
                const songElement = document.createElement('div');
                songElement.className = 'song-item';
                    //<div class="song-number">${index + 1}</div>
                songElement.innerHTML = `
                    <div class="song-category">${song.category} ${song.id}</div>
                    <div class="song-title">${song.title}</div>
                `;
                songElement.addEventListener('click', () => showSong(song.category, fullSong));
                weeklySongsContainer.appendChild(songElement);
            });

            mainView.style.display = 'none';
            weeklyView.style.display = 'block';
        }

        // 显示乐谱
        function showSong(categoryName, song) {
            loadingOverlay.style.display = 'none';
            loadingIndicator.style.display = 'none';
            
            // 记录是从哪个界面打开的
            if (weeklyView.style.display === 'block') {
                currentState.openedFrom = 'weekly';
            } else if (categoryView.style.display === 'block') {
                currentState.openedFrom = 'category';
            }
            
            currentState.currentCategory = categoryName;
            currentState.currentSong = song;
            currentState.currentPage = 1;
            currentState.totalPages = song.pages;
            currentState.availableVersions = ['原谱', ...song.versions];
            
            // 根据偏好设置当前版本
            if (song.versions.includes(currentState.preferredVersion)) {
                currentState.currentVersion = currentState.preferredVersion;
            } else {
                currentState.currentVersion = '原谱';
            }

            loadImage(currentState.currentPage);
            updatePageIndicator();
            renderVersionButtons();

            categoryView.style.display = 'none';
            weeklyView.style.display = 'none';
            viewerView.style.display = 'flex';
            // 滚动到顶部
            document.querySelector('.viewer-content').scrollTop = 0;
            
            // 添加历史记录
            history.pushState({viewingSheet: true}, null);
        }

        // 加载乐谱图片
        function loadImage(page) {
            // 显示加载指示器
            loadingOverlay.style.display = 'block';
            loadingIndicator.style.display = 'block';
            
            // 先清除图片源
            sheetImage.src = '';
            
            let imagePath;
            if (currentState.currentVersion === '原谱') {
                imagePath = `img/${currentState.currentCategory}/${currentState.currentSong.filename}_${page}.jpeg`;
            } else {
                imagePath = `img/${currentState.currentCategory}/${currentState.currentSong.filename}_${currentState.currentVersion}_${page}.jpeg`;
            }
            
            // 图片加载完成时隐藏指示器
            sheetImage.onload = function() {
                loadingOverlay.style.display = 'none';
                loadingIndicator.style.display = 'none';
            };
            
            // 图片加载出错时也隐藏指示器
            sheetImage.onerror = function() {
                loadingOverlay.style.display = 'none';
                loadingIndicator.style.display = 'none';
                // 可以在这里添加错误处理，比如显示一个错误消息
            };
            
            sheetImage.src = imagePath;
            
            // 预加载相邻页面（保持原有逻辑）
            if (page < currentState.totalPages) {
                const nextImage = new Image();
                if (currentState.currentVersion === '原谱') {
                    nextImage.src = `img/${currentState.currentCategory}/${currentState.currentSong.filename}_${page + 1}.jpeg`;
                } else {
                    nextImage.src = `img/${currentState.currentCategory}/${currentState.currentSong.filename}_${currentState.currentVersion}_${page + 1}.jpeg`;
                }
            }
            if (page > 1) {
                const prevImage = new Image();
                if (currentState.currentVersion === '原谱') {
                    prevImage.src = `img/${currentState.currentCategory}/${currentState.currentSong.filename}_${page - 1}.jpeg`;
                } else {
                    prevImage.src = `img/${currentState.currentCategory}/${currentState.currentSong.filename}_${currentState.currentVersion}_${page - 1}.jpeg`;
                }
            }
        }

        // 渲染版本切换按钮
        function renderVersionButtons() {
            versionButtonsContainer.innerHTML = '';
            
            // 总是显示版本切换按钮，即使只有原谱
            currentState.availableVersions.forEach(version => {
                const button = document.createElement('button');
                button.className = 'version-button';
                button.textContent = version;
                if (version === currentState.currentVersion) {
                    button.classList.add('active');
                }
                button.addEventListener('click', () => {
                    if (version !== currentState.currentVersion) {
                        currentState.currentVersion = version;
                        currentState.currentPage = 1;
                        loadImage(currentState.currentPage);
                        updatePageIndicator();
                        renderVersionButtons();
                        // 关闭折叠菜单
                        versionButtonsContainer.classList.remove('show');
                        // 更新箭头方向
                        document.querySelector('.version-toggle-button .arrow').textContent = '▼';
                    }
                });
                versionButtonsContainer.appendChild(button);
            });
            
            // 更新切换按钮文本
            versionButtonText.textContent = currentState.currentVersion;
            const arrow = versionToggleButton.querySelector('.arrow') || document.createElement('span');
            arrow.className = 'arrow';
            arrow.textContent = '▼';
            versionToggleButton.appendChild(arrow);
            
            // 总是显示版本切换按钮
            versionToggleButton.style.display = 'flex';
        }

        // 更新页码指示器
        function updatePageIndicator() {
            pageIndicator.textContent = `${currentState.currentPage} / ${currentState.totalPages}`;
        }

        // 关闭查看器
        function closeViewer() {
            loadingOverlay.style.display = 'none';
            loadingIndicator.style.display = 'none';
            viewerView.style.display = 'none';
            
            // 添加一个状态标记来记录是从哪个界面打开的查看器
            if (currentState.openedFrom === 'weekly') {
                weeklyView.style.display = 'block';
            } else if (currentState.openedFrom === 'category') {
                categoryView.style.display = 'block';
            } else {
                mainView.style.display = 'block';
            }
            
            // 清除打开来源标记
            currentState.openedFrom = null;
            history.replaceState(null, null);
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 返回按钮
            backButton.addEventListener('click', () => {
                categoryView.style.display = 'none';
                mainView.style.display = 'block';
            });
            
            // 本周歌曲返回按钮
            backButtonWeekly.addEventListener('click', () => {
                weeklyView.style.display = 'none';
                mainView.style.display = 'block';
            });

            // 关闭查看器按钮
            closeViewerButton.addEventListener('click', closeViewer);

            // 点击乐谱外区域关闭查看器
            viewerContent.addEventListener('click', (e) => {
                if (e.target === viewerContent) {
                    closeViewer();
                }
            });

            // 翻页按钮
            prevPageButton.addEventListener('click', () => {
                goToPrevPage();
            });

            nextPageButton.addEventListener('click', () => {
                goToNextPage();
            });

            // 版本切换按钮点击事件
            versionToggleButton.addEventListener('click', (e) => {
                e.stopPropagation();
                versionButtonsContainer.classList.toggle('show');
                const arrow = versionToggleButton.querySelector('.arrow');
                if (versionButtonsContainer.classList.contains('show')) {
                    arrow.textContent = '▲';
                } else {
                    arrow.textContent = '▼';
                }
            });

            // 点击页面其他地方关闭版本选择菜单
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.version-buttons-container') && 
                    !e.target.closest('.version-buttons')) {
                    versionButtonsContainer.classList.remove('show');
                    const arrow = versionToggleButton.querySelector('.arrow');
                    if (arrow) arrow.textContent = '▼';
                }
            });

            // 本周歌曲按钮点击事件
            weeklyButton.addEventListener('click', showWeeklySongs);

            // 监听返回键（针对移动设备）
            window.addEventListener('popstate', function(event) {
                if (viewerView.style.display === 'flex') {
                    // 如果正在查看乐谱，则关闭查看器而不退出页面
                    closeViewer();
                    // 阻止默认的返回行为
                    history.pushState(null, null, document.URL);
                    event.preventDefault();
                } else if (categoryView.style.display === 'block') {
                    // 如果在分类视图，返回主视图
                    categoryView.style.display = 'none';
                    mainView.style.display = 'block';
                    history.pushState(null, null, document.URL);
                    event.preventDefault();
                } else if (weeklyView.style.display === 'block') {
                    // 如果在本周歌曲视图，返回主视图
                    weeklyView.style.display = 'none';
                    mainView.style.display = 'block';
                    history.pushState(null, null, document.URL);
                    event.preventDefault();
                }
            });

            // 上一页函数
            function goToPrevPage() {
                if (currentState.currentPage > 1) {
                    currentState.currentPage--;
                    loadImage(currentState.currentPage);
                    updatePageIndicator();
                    // 滚动到顶部
                    document.querySelector('.viewer-content').scrollTop = 0;
                }
            }

            // 下一页函数
            function goToNextPage() {
                if (currentState.currentPage < currentState.totalPages) {
                    currentState.currentPage++;
                    loadImage(currentState.currentPage);
                    updatePageIndicator();
                    // 滚动到顶部
                    document.querySelector('.viewer-content').scrollTop = 0;
                }
            }

            // 触摸滑动翻页
            let touchStartX = 0;
            let touchEndX = 0;
            
            document.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, false);

            document.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, false);

            function handleSwipe() {
                if (!viewerView.style.display || viewerView.style.display === 'none') return;
                
                const threshold = 50; // 最小滑动距离
                const diff = touchStartX - touchEndX;
                
                if (diff > threshold) {
                    goToNextPage();
                } else if (diff < -threshold) {
                    goToPrevPage();
                }
            }

            // 键盘事件监听
            document.addEventListener('keydown', (e) => {
                // ESC键退出查看器
                if (e.key === 'Escape' && viewerView.style.display === 'flex') {
                    closeViewer();
                }
                
                // 左右方向键翻页
                if (viewerView.style.display === 'flex') {
                    if (e.key === 'ArrowLeft') {
                        goToPrevPage();
                    } else if (e.key === 'ArrowRight') {
                        goToNextPage();
                    }
                }
            });
        }

        // 启动应用
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
