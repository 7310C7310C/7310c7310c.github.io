<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>复活计划乐队</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans', 'Roboto', 'Arial';
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        body {
            background-color: #f5f1e8;
            color: #5a4a3a;
            min-height: 100vh;
            transition: background-color 0.3s;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 主界面样式 */
        #main-view {
            display: block;
        }
        
        .main-title {
            text-align: center;
            margin: 30px 0 20px;
            font-size: 2.5rem;
            color: #8c6a4d;
            letter-spacing: 2px;
        }
        
        .categories-list {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 10px;
        }
        
        .category-card {
            background-color: #e8dfd3;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
            padding-bottom: 15px;
        }
        
        .category-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .category-card h2 {
            margin-bottom: 10px;
            color: #6b4f3b;
        }
        
        /* 确保按钮和 div 表现一致 */
        button.category-card {
            border: none; /* 去掉默认边框 */
            width: 100%; /* 和分类卡片一样宽 */
            font-family: inherit; /* 继承字体 */
            font-size: inherit; /* 继承字号 */
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            margin-bottom: 15px; /* 和分类卡片一样的间距 */
        }
        
        /* 只覆盖本周歌曲按钮的背景色 */
        #weeklyButton.category-card {
            background-color: #c1b1a375; /* 略深的颜色 */
        }
        
        /* 分类界面样式 */
        #category-view {
            display: none;
        }
        
        /* 本周歌曲界面样式 */
        #weekly-view {
            display: none;
        }
        
        .back-button {
            background-color: #d4c8b8;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            margin-bottom: 30px;
            cursor: pointer;
            font-size: 1rem;
            color: #5a4a3a;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        #categoryTitle, #weeklyTitle {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.8rem;
            color: #8c6a4d;
        }
        
        .update-date {
            text-align: center;
            margin-bottom: 20px;
            color: #8c6a4d;
            font-style: italic;
        }
        
        .songs-list {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 0 20px;
        }
        
        .song-item {
            background-color: #e8dfd3;
            padding: 15px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            margin-bottom: 12px;
            padding-bottom: 12px;
        }
        
        .song-item:hover {
            background-color: #d9cdbc;
        }
        
        .song-number {
            font-weight: bold;
            margin-right: 15px;
            color: #8c6a4d;
            min-width: 35px;
        }
        
        .song-category {
            background-color: #8c6a4d;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 15px;
        }
        
        /* 乐谱查看器样式 */
        #viewer-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            z-index: 100;
            flex-direction: column;
        }
        
        .viewer-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow-y: auto;
            padding: 0;
        }
        
        .sheet-container {
            position: relative;
            max-width: 800px;
            margin: 0;
            overflow-x: visible;
        }
        
        .sheet-image {
            display: block;
            transition: all 0.3s ease;
            width: 100%;
            height: auto;
            max-width: 100%;
        }
        /* 适应高度时横向居中 */
        .fit-height-mode {
            display: block !important;
            margin-left: auto !important;
            margin-right: auto !important;
        }
        
        /* 页码指示器和版本按钮容器 */
        .page-controls-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            z-index: 110;
            background-color: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 0 4px; /* 统一内边距 */
            height: 32px;
            /* 添加以下属性确保宽度自适应内容 */
            width: auto;
            max-width: none;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.5);
            transition: border 0.2s;
        }
        .page-controls-container:hover {
            border: 1px solid rgba(255,255,255,0.8);
        }
        
        .song-nav {
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.7;
            padding: 0 4px;
            user-select: none;
            display: flex;
            align-items: center;
        }
        
        .song-nav:hover {
            opacity: 1;
        }
        
        .song-nav.disabled {
            opacity: 0.3;
            cursor: default;
        }
        
        .song-nav-text {
            font-size: 0.8rem;
            margin: 0 5px;
            display: inline;
        }
        
        .version-toggle-button {
            position: relative; /* 添加这行 */
            background-color: transparent;
            border: none;
            color: white;
            padding: 5px 10px;
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.2s;
            height: 32px;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }
        
        .version-toggle-button:hover {
            opacity: 1;
        }
        
        .version-toggle-button .arrow {
            margin-left: 5px;
            transition: transform 0.2s;
            font-size: 0.8rem;
        }
        
        .page-indicator-container {
            display: flex;
            align-items: center;
            padding: 0 10px;
            height: 32px;
        }
        
        .page-nav {
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.7;
            padding: 0 8px;
            user-select: none;
        }
        
        .page-nav:hover {
            opacity: 1;
        }
        
        .page-indicator {
            color: white;
            text-align: center;
            padding: 0 10px;
            font-size: 0.9rem;
        }
        
        .version-buttons {
            position: absolute;
            bottom: 40px;
            left: 33%; /* 改为居中定位 */
            transform: translateX(-50%); /* 添加水平居中 */
            display: none;
            flex-direction: column;
            gap: 5px;
            background-color: rgba(0,0,0,0.7);
            border-radius: 8px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 120;
            /* 添加最小宽度确保与按钮对齐 */
            min-width: 100px;
        }
        
        .version-buttons.show {
            display: flex;
        }
        
        .version-button {
            background-color: transparent;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
            text-align: left;
            white-space: nowrap;
            font-size: 0.9rem;
        }
        
        .version-button:hover {
            opacity: 1;
            background-color: rgba(255,255,255,0.1);
        }
        
        .version-button.active {
            opacity: 1;
            background-color: rgba(140, 106, 77, 0.7);
        }
        
        .close-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0,0,0,0.5);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 110;
            opacity: 0.7;
            transition: opacity 0.2s;
            border: 1px solid rgba(255,255,255,0.5);
        }
        
        .close-button:hover {
            opacity: 1;
            background-color: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.8);
        }
        
        /* 优先显示选项 */
        .version-select {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #d4c8b8;
            background-color: #f5f1e8;
            color: #5a4a3a;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .version-select:hover {
            border-color: #8c6a4d;
        }
        
        .version-select:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(140, 106, 77, 0.2);
        }
        
        .version-preference {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0 30px 0;
            gap: 8px;
            background: #ede5db;
            border-radius: 18px;
            padding: 8px 18px;
            box-shadow: 0 1px 4px rgba(140,106,77,0.06);
        }
        .version-preference span {
            font-weight: 500;
            color: #7a5a3a;
            margin-right: 8px; /* 新增，调整间距 */
        }
        .version-select {
            border-radius: 12px;
            padding: 6px 16px;
            background: #f8f5f0;
            border: 1px solid #d4c8b8;
            color: #5a4a3a;
            font-size: 1rem;
        }
        
        /* 搜索框样式 */
        .search-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
            width: 100%;
        }
        
        .search-box {
            position: relative;
            width: 90%;
            max-width: 500px;
        }
        
        .search-input {
            width: 100%;
            padding: 10px 15px;
            padding-right: 70px;
            border-radius: 20px;
            border: 1px solid #d4c8b8;
            background-color: #f5f1e8;
            color: #5a4a3a;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .search-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(140, 106, 77, 0.2);
            border-color: #8c6a4d;
        }
        
        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8c6a4d;
            pointer-events: none;
        }
        
        .clear-search {
            position: absolute;
            right: 45px;
            top: 50%;
            transform: translateY(-50%);
            color: #8c6a4d;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease;
            background: none;
            border: none;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 2;
        }
        
        .clear-search:hover {
            color: #5a4a3a;
        }
        
        .clear-search.visible {
            opacity: 0.7;
            pointer-events: auto;
        }
        
        .search-results {
            display: none;
            margin-top: 20px;
        }
        
        .search-results.show {
            display: block;
        }
        
        .search-results-title {
            text-align: center;
            color: #8c6a4d;
            margin-bottom: 15px;
        }
        
        .no-results {
            text-align: center;
            color: #5a4a3a;
            padding: 20px;
            font-style: italic;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-title {
                font-size: 2rem;
                margin: 20px 0 30px;
            }
            
            .category-card {
                padding: 20px;
            }
            
            #categoryTitle, #weeklyTitle {
                font-size: 1.5rem;
                margin-bottom: 25px;
            }
            
            .close-button {
                width: 35px;
                height: 35px;
                font-size: 1.2rem;
            }
            
            .version-toggle-button {
                font-size: 0.8rem;
                padding: 5px 8px;
            }
            
            .page-indicator {
                font-size: 0.8rem;
            }
            
            .song-category {
                margin-right: 10px;
                font-size: 0.7rem;
            }
            
            .search-input {
                padding: 8px 12px;
                padding-right: 65px;
                font-size: 0.9rem;
            }
            
            .search-icon {
                right: 12px;
            }
            
            .search-container {
                margin: 10px 0;
            }

            .loading-indicator {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: white;
                font-size: 1.2rem;
                z-index: 105;
                display: none;
            }

            .loading-spinner {
                border: 4px solid rgba(255, 255, 255, 0.3);
                border-radius: 50%;
                border-top: 4px solid white;
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
                margin: 0 auto 10px;
            }

            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }

            /* 在查看器背景上添加半透明遮罩 */
            .loading-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.7);
                z-index: 104;
                display: none;
            }

            .clear-search {
                right: 38px;
                width: 22px;
                height: 22px;
                font-size: 1.1rem;
            }
        }
        
        /* 最近查看和收藏区域样式 */
        .section-title {
            text-align: center;
            color: #8c6a4d;
            margin: 25px 0 15px;
            font-size: 1.5rem;
            position: relative;
        }
        
        .section-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 25px 0 15px;
            position: relative;
        }
        
        .section-header .section-title {
            margin: 0;
        }
        
        .clear-button {
            position: absolute;
            right: 0;
            background: none;
            border: none;
            color: #8c6a4d;
            font-size: 0.9rem;
            cursor: pointer;
            opacity: 0.7;
            padding: 5px 10px;
            transition: opacity 0.2s;
        }
        
        .clear-button:hover {
            opacity: 1;
            text-decoration: underline;
        }
        
        .recently-viewed-container {
            margin-bottom: 20px;
        }
        
        .empty-list-message {
            text-align: center;
            padding: 15px;
            color: #8c6a4d;
            font-style: italic;
        }
        
        /* 临时收藏按钮样式 */
        .favorite-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.5);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 110;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        
        .favorite-button:hover {
            opacity: 1;
            background-color: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.8);
        }
        
        .favorite-button.active svg {
            fill: #ff5e5e;
            stroke: #ff5e5e;
        }
        
        /* 收藏项目的取消收藏按钮 */
        .unfavorite-button {
            background: none;
            border: none;
            color: #8c6a4d;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 10px;
            transition: all 0.2s;
        }
        
        .unfavorite-button svg {
            width: 16px;
            height: 16px;
            fill: #ff5e5e;
            stroke: #ff5e5e;
            transition: all 0.2s;
        }
        
        .unfavorite-button:hover {
            background-color: rgba(255, 94, 94, 0.1);
            transform: scale(1.1);
        }
        
        /* 收藏项目布局 */
        .favorite-item {
            display: flex;
            align-items: center;
        }
        
        .favorite-item .song-info {
            flex: 1;
            display: flex;
        }
        
        .favorite-item .song-category {
            margin-right: 15px;
        }
        
        @media (max-width: 768px) {
            .favorite-button {
                width: 35px;
                height: 35px;
                top: 15px;
                left: 15px;
            }
            
            .section-title {
                font-size: 1.3rem;
            }
            
            .clear-button {
                font-size: 0.8rem;
            }
        }
        
        /* 最近查看和收藏区域样式 */
        .section-title {
            text-align: center;
            color: #8c6a4d;
            margin: 25px 0 15px;
            font-size: 1.5rem;
            position: relative;
        }
        
        .section-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 25px 0 15px;
            position: relative;
        }
        
        .section-header .section-title {
            margin: 0;
        }
        
        .clear-button {
            position: absolute;
            right: 0;
            background: none;
            border: none;
            color: #8c6a4d;
            font-size: 0.9rem;
            cursor: pointer;
            opacity: 0.7;
            padding: 5px 10px;
            transition: opacity 0.2s;
        }
        
        .clear-button:hover {
            opacity: 1;
            text-decoration: underline;
        }
        
        .history-panel-container {
            position: fixed;
            top: 0;
            right: 0;
            width: 320px;
            height: 100vh;
            background-color: rgba(245, 241, 232, 0.97);
            box-shadow: -3px 0 10px rgba(0, 0, 0, 0.15);
            z-index: 150;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .history-panel-container.show {
            transform: translateX(0);
        }
        
        .history-panel-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(140, 106, 77, 0.2);
        }
        
        .history-panel-title {
            font-size: 1.3rem;
            color: #8c6a4d;
            margin: 0;
        }
        
        .history-panel-close {
            background: none;
            border: none;
            color: #8c6a4d;
            font-size: 1.5rem;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            transition: background-color 0.2s;
        }
        
        .history-panel-close:hover {
            background-color: rgba(140, 106, 77, 0.1);
        }
        
        .history-panel-content {
            padding: 0 15px 20px;
            flex: 1;
            overflow-y: auto;
        }
        
        .history-tab-container {
            display: flex;
            border-bottom: 1px solid rgba(140, 106, 77, 0.2);
            margin: 0 -15px 15px;
        }
        
        .history-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            color: #8c6a4d;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        
        .history-tab.active {
            border-bottom: 2px solid #8c6a4d;
            background-color: rgba(140, 106, 77, 0.1);
        }
        
        .history-tab:hover {
            background-color: rgba(140, 106, 77, 0.05);
        }
        
        .history-tab-panel {
            display: none;
        }
        
        .history-tab-panel.active {
            display: block;
        }
        
        .history-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(140, 106, 77, 0.7);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 110;
            transition: background-color 0.2s, transform 0.2s;
        }
        
        .history-button:hover {
            background-color: rgba(140, 106, 77, 0.9);
            transform: scale(1.05);
        }
        
        .history-button svg {
            width: 24px;
            height: 24px;
        }
        
        .recently-viewed-container,
        .favorites-container {
            margin-bottom: 20px;
        }
        
        .empty-list-message {
            text-align: center;
            padding: 15px;
            color: #8c6a4d;
            font-style: italic;
        }
        
        /* 收藏按钮样式 */
        .favorite-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.5);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 110;
            opacity: 0.7;
            transition: opacity 0.2s;

        // 本地存储管理
        const storageManager = {
            // 键名
            keys: {
                recentlyViewed: 'fhj_recently_viewed',
                favorites: 'fhj_favorites'
            },
            
            // 初始化存储
            initialize() {
                // 如果本地存储中没有数据，创建初始结构
                if (!localStorage.getItem(this.keys.recentlyViewed)) {
                    localStorage.setItem(this.keys.recentlyViewed, JSON.stringify({
                        items: [],
                        maxItems: 10
                    }));
                }
                
                if (!localStorage.getItem(this.keys.favorites)) {
                    localStorage.setItem(this.keys.favorites, JSON.stringify({
                        items: []
                    }));
                }
                
                // 旧代码已移除 - 不再需要临时收藏迁移逻辑
            },
            
            // 获取最近查看记录
            getRecentlyViewed() {
                try {
                    return JSON.parse(localStorage.getItem(this.keys.recentlyViewed));
                } catch (e) {
                    console.error('获取最近查看记录失败', e);
                    return { items: [], maxItems: 10 };
                }
            },
            
            // 添加最近查看记录
            addToRecentlyViewed(song, category) {
                try {
                    const recentlyViewed = this.getRecentlyViewed();
                    
                    // 检查是否已存在，如果存在则删除旧记录
                    const existingIndex = recentlyViewed.items.findIndex(
                        item => item.id === song.id && item.category === category
                    );
                    
                    if (existingIndex !== -1) {
                        recentlyViewed.items.splice(existingIndex, 1);
                    }
                    
                    // 添加新记录到开头
                    recentlyViewed.items.unshift({
                        id: song.id,
                        title: song.title,
                        category: category,
                        timestamp: Date.now()
                    });
                    
                    // 如果超过最大数量，删除最旧的
                    if (recentlyViewed.items.length > recentlyViewed.maxItems) {
                        recentlyViewed.items.pop();
                    }
                    
                    // 保存到本地存储
                    localStorage.setItem(this.keys.recentlyViewed, JSON.stringify(recentlyViewed));
                    return true;
                } catch (e) {
                    console.error('添加最近查看记录失败', e);
                    return false;
                }
            },
            
            // 清空最近查看记录
            clearRecentlyViewed() {
                try {
                    localStorage.setItem(this.keys.recentlyViewed, JSON.stringify({
                        items: [],
                        maxItems: 10
                    }));
                    return true;
                } catch (e) {
                    console.error('清空最近查看记录失败', e);
                    return false;
                }
            },
            
            // 获取收藏
            getFavorites() {
                try {
                    return JSON.parse(localStorage.getItem(this.keys.favorites));
                } catch (e) {
                    console.error('获取收藏失败', e);
                    return { items: [] };
                }
            },
            
            // 添加/移除收藏
            toggleFavorite(song, category) {
                try {
                    const favorites = this.getFavorites();
                    
                    // 检查是否已经收藏
                    const existingIndex = favorites.items.findIndex(
                        item => item.id === song.id && item.category === category
                    );
                    
                    // 如果已存在，则移除
                    if (existingIndex !== -1) {
                        favorites.items.splice(existingIndex, 1);
                        localStorage.setItem(this.keys.favorites, JSON.stringify(favorites));
                        return false; // 返回false表示已取消收藏
                    }
                    
                    // 如果不存在，添加到收藏
                    favorites.items.push({
                        id: song.id,
                        title: song.title,
                        category: category,
                        timestamp: Date.now()
                    });
                    
                    // 保存到本地存储
                    localStorage.setItem(this.keys.favorites, JSON.stringify(favorites));
                    return true; // 返回true表示已添加收藏
                } catch (e) {
                    console.error('切换收藏状态失败', e);
                    return null;
                }
            },
            
            // 清空收藏
            clearFavorites() {
                try {
                    localStorage.setItem(this.keys.favorites, JSON.stringify({
                        items: []
                    }));
                    return true;
                } catch (e) {
                    console.error('清空收藏失败', e);
                    return false;
                }
            },
            
            // 检查是否已收藏
            isFavorite(songId, category) {
                try {
                    const favorites = this.getFavorites();
                    return favorites.items.some(
                        item => item.id === songId && item.category === category
                    );
                } catch (e) {
                    console.error('检查收藏状态失败', e);
                    return false;
                }
            }
        };

        // 更新分类名称（在列表中和显示歌曲时）
        function updateCategoryNames() {
            // 更新分类卡片
            const categoryCards = document.querySelectorAll('.category-card:not(#weeklyButton)');
            categoryCards.forEach(card => {
                const titleElement = card.querySelector('h2');
                if (titleElement) {
                    const originalName = titleElement.getAttribute('data-original-name') || titleElement.textContent;
                    titleElement.setAttribute('data-original-name', originalName);
                    titleElement.textContent = t(originalName, 'categories');
                }
            });
            
            // 更新歌曲列表中的分类标签
            const categoryLabels = document.querySelectorAll('.song-category');
            categoryLabels.forEach(label => {
                const text = label.textContent;
                const parts = text.split(' ');
                if (parts.length >= 2) {
                    const categoryName = parts[0];
                    const songId = parts.slice(1).join(' ');
                    label.textContent = `${t(categoryName, 'categories')} ${songId}`;
                }
            });
        }
        
        // 更新版本选择下拉菜单
        function updateVersionSelect() {
            const versionSelect = document.getElementById('versionSelect');
            if (!versionSelect) return;
            
            // 保存当前选中的值
            const selectedValue = versionSelect.value;
            
            // 清空并重新填充选项
            versionSelect.innerHTML = '';
            
            // 添加原谱选项
            const originalOption = document.createElement('option');
            originalOption.value = "原谱";
            originalOption.textContent = t('原谱', 'versions');
            originalOption.selected = selectedValue === '原谱';
            versionSelect.appendChild(originalOption);
            
            // 获取所有版本并添加到下拉菜单
            const allVersions = getAllVersions();
            allVersions.forEach(version => {
                if (version !== '原谱') {
                    const option = document.createElement('option');
                    option.value = version;
                    option.textContent = t(version, 'versions');
                    option.selected = selectedValue === version;
                    versionSelect.appendChild(option);
                }
            });
        }
        
        // 获取所有可用的版本名称
        function getAllVersions() {
            const allVersions = new Set(['原谱']);
            songsData.categories.forEach(category => {
                category.songs.forEach(song => {
                    song.versions.forEach(version => {
                        allVersions.add(version);
                    });
                });
            });
            return Array.from(allVersions);
        }

        // 渲染分类列表
        function renderCategories() {
            categoriesContainer.innerHTML = '';
            songsData.categories.forEach(category => {
                const categoryElement = document.createElement('div');
                categoryElement.className = 'category-card';
                
                // 使用 data-original-name 保存原始名称以便语言切换
                categoryElement.innerHTML = `
                    <h2 data-original-name="${category.name}">${t(category.name, 'categories')}</h2>
                    <p>${category.songs.length} ${t('songsCount')}</p>
                `;
                categoryElement.addEventListener('click', () => showCategory(category.name));
                categoriesContainer.appendChild(categoryElement);
            });
        }

        // 渲染版本偏好选项
        function renderVersionPreference() {
            // 收集所有可用的版本
            const allVersions = getAllVersions();
            
            const versionSelect = document.getElementById('versionSelect');
            versionSelect.innerHTML = '';
            
            // 添加原谱选项
            const originalOption = document.createElement('option');
            originalOption.value = "原谱";
            originalOption.textContent = t('原谱', 'versions');
            originalOption.selected = currentState.preferredVersion === '原谱';
            versionSelect.appendChild(originalOption);
            
            // 添加其他版本选项
            Array.from(allVersions).forEach(version => {
                if (version !== '原谱') {
                    const option = document.createElement('option');
                    option.value = version;
                    option.textContent = t(version, 'versions');
                    option.selected = currentState.preferredVersion === version;
                    versionSelect.appendChild(option);
                }
            });
            
            // 更新"优先显示"文本
            document.querySelector('#versionPreference span').textContent = t('preferredVersion');
            
            // 添加事件监听
            versionSelect.addEventListener('change', () => {
                currentState.preferredVersion = versionSelect.value;
            });
        }

        // 显示分类下的歌曲
        function showCategory(categoryName) {
            const category = songsData.categories.find(c => c.name === categoryName);
            if (!category) return;

            currentState.currentCategory = categoryName;
            categoryTitle.textContent = t(categoryName, 'categories');
            songsContainer.innerHTML = '';
            
            // 存储当前歌曲列表，用于导航
            currentState.currentSongList = category.songs.map(song => ({
                ...song,
                category: categoryName
            }));

            category.songs.forEach((song) => {
                const songElement = document.createElement('div');
                songElement.className = 'song-item';
                songElement.innerHTML = `
                    <div class="song-number">${song.id}</div>
                    <div class="song-title">${song.title}</div>
                `;
                songElement.addEventListener('click', () => showSong(categoryName, song));
                songsContainer.appendChild(songElement);
            });

            mainView.style.display = 'none';
            categoryView.style.display = 'block';
            
            // 隐藏历史按钮和语言切换按钮
            historyButton.style.display = 'none';
            document.getElementById('languageButton').style.display = 'none';

            // 新增：切换到分类界面时滚动到顶部
            window.scrollTo(0, 0);
        }

        // 显示本周歌曲
        function showWeeklySongs() {
            currentState.openedFrom = null;
            updateDate.textContent = `${t('updateDate')}${songsData.weeklySongs.updateDate}`;
            weeklySongsContainer.innerHTML = '';
            
            // 存储当前歌曲列表，用于导航
            currentState.currentSongList = songsData.weeklySongs.songs.map(item => {
                const category = songsData.categories.find(c => c.name === item.category);
                if (!category) return null;
                
                const fullSong = category.songs.find(s => s.id === item.id);
                if (!fullSong) return null;
                
                return {
                    ...fullSong,
                    category: item.category
                };
            }).filter(Boolean); // 过滤掉null值
            
            songsData.weeklySongs.songs.forEach((song, index) => {
                const category = songsData.categories.find(c => c.name === song.category);
                if (!category) return;
                
                const fullSong = category.songs.find(s => s.id === song.id);
                if (!fullSong) return;
                
                const songElement = document.createElement('div');
                songElement.className = 'song-item';
                songElement.innerHTML = `
                    <div class="song-category">${t(song.category, 'categories')} ${song.id}</div>
                    <div class="song-title">${song.title}</div>
                `;
                songElement.addEventListener('click', () => showSong(song.category, fullSong));
                weeklySongsContainer.appendChild(songElement);
            });

            mainView.style.display = 'none';
            weeklyView.style.display = 'block';
            
            // 隐藏历史按钮和语言切换按钮
            historyButton.style.display = 'none';
            document.getElementById('languageButton').style.display = 'none';
        }

        // 显示乐谱
        function showSong(categoryName, song) {
            loadingOverlay.style.display = 'none';
            loadingIndicator.style.display = 'none';
            
        // 记录是从哪个界面打开的，并设置对应的歌曲列表
        if (weeklyView.style.display === 'block') {
            currentState.openedFrom = 'weekly';
            // 设置当前歌曲列表为本周歌曲
            currentState.currentSongList = songsData.weeklySongs.songs.map(item => {
                const category = songsData.categories.find(c => c.name === item.category);
                if (!category) return null;
                const fullSong = category.songs.find(s => s.id === item.id);
                if (!fullSong) return null;
                return {
                    ...fullSong,
                    category: item.category
                };
            }).filter(Boolean);
        } else if (categoryView.style.display === 'block') {
            currentState.openedFrom = 'category';
            // 设置当前歌曲列表为当前分类下的歌曲
            const category = songsData.categories.find(c => c.name === categoryName);
            currentState.currentSongList = category.songs.map(s => ({
                ...s,
                category: categoryName
            }));
        } else if (searchResults.classList.contains('show')) {
            currentState.openedFrom = 'search';
            // 搜索列表已经在performSearch中设置
        } else if (historyPanel.classList.contains('show')) {
            currentState.openedFrom = 'history';
            // 根据当前激活的标签页设置歌曲列表
            if (recentPanel.classList.contains('active')) {
                // 设置当前歌曲列表为最近查看的歌曲
                const recentData = storageManager.getRecentlyViewed();
                currentState.currentSongList = recentData.items.map(item => {
                    const category = songsData.categories.find(c => c.name === item.category);
                    if (!category) return null;
                    const fullSong = category.songs.find(s => s.id === item.id);
                    if (!fullSong) return null;
                    return {
                        ...fullSong,
                        category: item.category
                    };
                }).filter(Boolean);
            } else {
                // 设置当前歌曲列表为收藏的歌曲
                const favoritesData = storageManager.getFavorites();
                currentState.currentSongList = favoritesData.items.map(item => {
                    const category = songsData.categories.find(c => c.name === item.category);
                    if (!category) return null;
                    const fullSong = category.songs.find(s => s.id === item.id);
                    if (!fullSong) return null;
                    return {
                        ...fullSong,
                        category: item.category
                    };
                }).filter(Boolean);
            }
        }
            
            // 添加到最近查看记录
            storageManager.addToRecentlyViewed(song, categoryName);
            
            currentState.currentCategory = categoryName;
            currentState.currentSong = song;
            currentState.currentPage = 1;
            currentState.totalPages = song.pages;
            currentState.availableVersions = ['原谱', ...song.versions];
            
            // 根据偏好设置当前版本
            if (song.versions.includes(currentState.preferredVersion)) {
                currentState.currentVersion = currentState.preferredVersion;
            } else {
                currentState.currentVersion = '原谱';
            }

            loadImage(currentState.currentPage);
            updatePageIndicator();
            renderVersionButtons();
            updateSongNavButtons();
            
            // 检查是否已收藏并更新收藏按钮状态
            if (storageManager.isFavorite(song.id, categoryName)) {
                favoriteButton.classList.add('active');
            } else {
                favoriteButton.classList.remove('active');
            }

            categoryView.style.display = 'none';
            weeklyView.style.display = 'none';
            viewerView.style.display = 'flex';
            
            // 无论从哪个界面打开，在查看乐谱时都隐藏历史按钮
            historyButton.style.display = 'none';
            
            // 滚动到顶部
            document.querySelector('.viewer-content').scrollTop = 0;
            
            // 添加历史记录
            history.pushState({viewingSheet: true}, null);
        }

        // 加载乐谱图片
        function loadImage(page) {
            // 显示加载指示器
            loadingOverlay.style.display = 'block';
            loadingIndicator.style.display = 'block';
            
            // 先清除图片源
            sheetImage.src = '';
            
            let imagePath;
            if (currentState.currentVersion === '原谱') {
                imagePath = `img/${currentState.currentCategory}/${currentState.currentSong.filename}_${page}.jpeg`;
            } else {
                imagePath = `img/${currentState.currentCategory}/${currentState.currentSong.filename}_${currentState.currentVersion}_${page}.jpeg`;
            }
            
            // 图片加载完成时隐藏指示器
            sheetImage.onload = function() {
                loadingOverlay.style.display = 'none';
                loadingIndicator.style.display = 'none';
                // 同步canvas尺寸
                syncDoodleCanvasSize();
            };
            
            // 图片加载出错时也隐藏指示器
            sheetImage.onerror = function() {
                loadingOverlay.style.display = 'none';
                loadingIndicator.style.display = 'none';
                // 可以在这里添加错误处理，比如显示一个错误消息
            };
            
            sheetImage.src = imagePath;
            
            // 预加载相邻页面（保持原有逻辑）
            if (page < currentState.totalPages) {
                const nextImage = new Image();
                if (currentState.currentVersion === '原谱') {
                    nextImage.src = `img/${currentState.currentCategory}/${currentState.currentSong.filename}_${page + 1}.jpeg`;
                } else {
                    nextImage.src = `img/${currentState.currentCategory}/${currentState.currentSong.filename}_${currentState.currentVersion}_${page + 1}.jpeg`;
                }
            }
            if (page > 1) {
                const prevImage = new Image();
                if (currentState.currentVersion === '原谱') {
                    prevImage.src = `img/${currentState.currentCategory}/${currentState.currentSong.filename}_${page - 1}.jpeg`;
                } else {
                    prevImage.src = `img/${currentState.currentCategory}/${currentState.currentSong.filename}_${currentState.currentVersion}_${page - 1}.jpeg`;
                }
            }
        }

        // 渲染版本切换按钮
        function renderVersionButtons() {
            versionButtonsContainer.innerHTML = '';
            
            // 总是显示版本切换按钮，即使只有原谱
            currentState.availableVersions.forEach(version => {
                const button = document.createElement('button');
                button.className = 'version-button';
                button.textContent = t(version, 'versions');
                if (version === currentState.currentVersion) {
                    button.classList.add('active');
                }
                button.addEventListener('click', () => {
                    if (version !== currentState.currentVersion) {
                        currentState.currentVersion = version;
                        currentState.currentPage = 1;
                        loadImage(currentState.currentPage);
                        updatePageIndicator();
                        renderVersionButtons();
                        // 关闭折叠菜单
                        versionButtonsContainer.classList.remove('show');
                        // 更新箭头方向
                        document.querySelector('.version-toggle-button .arrow').textContent = '▼';
                    }
                });
                versionButtonsContainer.appendChild(button);
            });
            
            // 更新切换按钮文本
            versionButtonText.textContent = t(currentState.currentVersion, 'versions');
            const arrow = versionToggleButton.querySelector('.arrow') || document.createElement('span');
            arrow.className = 'arrow';
            arrow.textContent = '▼';
            versionToggleButton.appendChild(arrow);
            
            // 总是显示版本切换按钮
            versionToggleButton.style.display = 'flex';
        }

        // 更新页码指示器
        function updatePageIndicator() {
            pageIndicator.textContent = `${currentState.currentPage} / ${currentState.totalPages}`;
            
            // 更新翻页按钮状态
            prevPageButton.style.opacity = currentState.currentPage > 1 ? '0.7' : '0.3';
            nextPageButton.style.opacity = currentState.currentPage < currentState.totalPages ? '0.7' : '0.3';
        }
        
        // 更新歌曲导航按钮状态
        function updateSongNavButtons() {
            if (!currentState.currentSongList || currentState.currentSongList.length === 0) {
                prevSongButton.classList.add('disabled');
                nextSongButton.classList.add('disabled');
                return;
            }
            
            const currentIndex = currentState.currentSongList.findIndex(
                song => song.id === currentState.currentSong.id && song.category === currentState.currentCategory
            );
            
            // 上一首按钮状态
            if (currentIndex > 0) {
                prevSongButton.classList.remove('disabled');
                prevSongButton.style.opacity = '0.7';
            } else {
                prevSongButton.classList.add('disabled');
                prevSongButton.style.opacity = '0.3';
            }
            
            // 下一首按钮状态
            if (currentIndex < currentState.currentSongList.length - 1) {
                nextSongButton.classList.remove('disabled');
                nextSongButton.style.opacity = '0.7';
            } else {
                nextSongButton.classList.add('disabled');
                nextSongButton.style.opacity = '0.3';
            }
        }
        
        // 导航到上一首歌曲
        function goToPrevSong() {
            if (!currentState.currentSongList || currentState.currentSongList.length === 0) return;
            
            const currentIndex = currentState.currentSongList.findIndex(
                song => song.id === currentState.currentSong.id && song.category === currentState.currentCategory
            );
            
            if (currentIndex > 0) {
                const prevSong = currentState.currentSongList[currentIndex - 1];
                showSong(prevSong.category, prevSong);
            }
        }

        // 导航到下一首歌曲
        function goToNextSong() {
            if (!currentState.currentSongList || currentState.currentSongList.length === 0) return;
            
            const currentIndex = currentState.currentSongList.findIndex(
                song => song.id === currentState.currentSong.id && song.category === currentState.currentCategory
            );
            
            if (currentIndex < currentState.currentSongList.length - 1) {
                const nextSong = currentState.currentSongList[currentIndex + 1];
                showSong(nextSong.category, nextSong);
            }
        }

        // 关闭查看器
        function closeViewer() {
            loadingOverlay.style.display = 'none';
            loadingIndicator.style.display = 'none';
            viewerView.style.display = 'none';
            doodleCanvas.style.display = 'none';
            
            // 添加一个状态标记来记录是从哪个界面打开的查看器
            if (currentState.openedFrom === 'weekly') {
                weeklyView.style.display = 'block';
                // 周歌曲界面不显示历史按钮
                historyButton.style.display = 'none';
            } else if (currentState.openedFrom === 'category') {
                categoryView.style.display = 'block';
                // 分类界面不显示历史按钮
                historyButton.style.display = 'none';
            } else if (currentState.openedFrom === 'search') {
                // 从搜索结果回来，保持搜索结果显示
                searchResults.classList.add('show');
                categoriesContainer.style.display = 'none';
                weeklyButton.style.display = 'none';
                versionPreferenceContainer.style.display = 'none';
                mainView.style.display = 'block';
                currentState.isSearchActive = true;
                
                // 确保搜索框仍然有值
                if (searchInput.value.trim() === '' && currentState.lastSearchQuery) {
                    searchInput.value = currentState.lastSearchQuery;
                }
                
                // 搜索结果界面不显示历史按钮和语言切换按钮
                historyButton.style.display = 'none';
                document.getElementById('languageButton').style.display = 'none';
                
                // 添加搜索激活标志
                document.body.classList.add('search-active');
                
            } else if (currentState.openedFrom === 'history') {
                // 从历史/收藏面板回来，返回主界面
                mainView.style.display = 'block';
                // 主界面显示历史按钮
                historyButton.style.display = 'flex';
            } else {
                mainView.style.display = 'block';
                // 主界面显示历史按钮
                historyButton.style.display = 'flex';
            }
            
            // 更新最近查看和收藏列表
            renderRecentlyViewed();
            renderFavorites();
            
            // 清除打开来源标记
            currentState.openedFrom = null;
            history.replaceState(null, null);
            // 退出时恢复图片适应模式为宽度适应
            isFitHeight = false;
            updateSheetFitMode();
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 返回按钮
            backButton.addEventListener('click', () => {
                categoryView.style.display = 'none';
                mainView.style.display = 'block';
                // 返回主界面时显示历史按钮和语言切换按钮
                historyButton.style.display = 'flex';
                document.getElementById('languageButton').style.display = 'flex';
            });
            
            // 本周歌曲返回按钮
            backButtonWeekly.addEventListener('click', () => {
                weeklyView.style.display = 'none';
                mainView.style.display = 'block';
                // 返回主界面时显示历史按钮和语言切换按钮
                historyButton.style.display = 'flex';
                document.getElementById('languageButton').style.display = 'flex';
            });

            // 关闭查看器按钮
            closeViewerButton.addEventListener('click', closeViewer);

            // 点击乐谱外区域关闭查看器
            viewerContent.addEventListener('click', (e) => {
                if (e.target === viewerContent) {
                    closeViewer();
                }
            });

            // 翻页按钮
            prevPageButton.addEventListener('click', () => {
                goToPrevPage();
            });

            nextPageButton.addEventListener('click', () => {
                goToNextPage();
            });
            
            // 歌曲导航按钮
            prevSongButton.addEventListener('click', () => {
                if (!prevSongButton.classList.contains('disabled')) {
                    goToPrevSong();
                }
            });
            
            nextSongButton.addEventListener('click', () => {
                if (!nextSongButton.classList.contains('disabled')) {
                    goToNextSong();
                }
            });

            // 版本切换按钮点击事件
            versionToggleButton.addEventListener('click', (e) => {
                e.stopPropagation();
                versionButtonsContainer.classList.toggle('show');
                const arrow = versionToggleButton.querySelector('.arrow');
                if (versionButtonsContainer.classList.contains('show')) {
                    arrow.textContent = '▲';
                } else {
                    arrow.textContent = '▼';
                }
            });

            // 点击页面其他地方关闭版本选择菜单
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.version-buttons-container') && 
                    !e.target.closest('.version-buttons')) {
                    versionButtonsContainer.classList.remove('show');

            // 上一页函数
            function goToPrevPage() {
                if (isDoodleMode) return; // 涂改时禁止翻页
                if (currentState.currentPage > 1) {
                    currentState.currentPage--;
                    loadImage(currentState.currentPage);
                    updatePageIndicator();
                    // 滚动到顶部
                    document.querySelector('.viewer-content').scrollTop = 0;
                }
            }

            // 下一页函数
            function goToNextPage() {
                if (isDoodleMode) return; // 涂改时禁止翻页
                if (currentState.currentPage < currentState.totalPages) {
                    currentState.currentPage++;
                    loadImage(currentState.currentPage);
                    updatePageIndicator();
                    // 滚动到顶部
                    document.querySelector('.viewer-content').scrollTop = 0;
                }
            }

            // 触摸滑动翻页
            let touchStartX = 0;
            let touchEndX = 0;
            let touchStartY = 0;
            let touchEndY = 0;
            document.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, false);
            document.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                touchEndY = e.changedTouches[0].screenY;
                handleSwipe();
            }, false);
            function handleSwipe() {
                if (!viewerView.style.display || viewerView.style.display === 'none') return;
                if (isDoodleMode) return; // 涂改时禁止滑动翻页
                const threshold = 50; // 最小横向滑动距离
                const verticalLimit = 40; // 允许的最大纵向偏移
                const diffX = touchStartX - touchEndX;
                const diffY = Math.abs(touchStartY - touchEndY);
                if (diffY > verticalLimit) return; // 纵向偏移大，不触发翻页
                if (diffX > threshold) {
                    goToNextPage();
                } else if (diffX < -threshold) {
                    goToPrevPage();
                }
            }

            // 键盘事件监听
            document.addEventListener('keydown', (e) => {
                // 涂改时禁止所有翻页/切歌/退出
                if (isDoodleMode) {
                    if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Escape"].includes(e.key)) {
                        e.preventDefault();
                        e.stopPropagation();
                        return;
                    }

                // ESC键退出查看器
                if (e.key === 'Escape' && viewerView.style.display === 'flex') {
                    closeViewer();

                // 左右方向键翻页
                if (viewerView.style.display === 'flex') {
                    if (e.key === 'ArrowLeft') {
                        goToPrevPage();
                    } else if (e.key === 'ArrowRight') {
                        goToNextPage();
                    }

                // 上下方向键切换歌曲

        // 执行搜索
        function performSearch() {
            const query = searchInput.value.trim().toLowerCase();
            if (query.length < 1) {
                searchResults.classList.remove('show');
                categoriesContainer.style.display = '';
                weeklyButton.style.display = '';
                versionPreferenceContainer.style.display = '';
                currentState.isSearchActive = false;
                // 隐藏历史/收藏按钮
                historyButton.style.display = 'flex';
                // 移除搜索激活标志
                document.body.classList.remove('search-active');
                return;
            }
            currentState.isSearchActive = true;
            currentState.lastSearchQuery = query;
            // 收集所有歌曲
            const allSongs = [];
            songsData.categories.forEach(category => {
                category.songs.forEach(song => {
                    allSongs.push({
                        category: category.name,
                        categoryId: category.name,
                        ...song
                    });
                });
            });
            // 过滤匹配的歌曲
            const matchedSongs = allSongs.filter(song => 
                song.title.toLowerCase().includes(query) || 
                song.id.toLowerCase().includes(query) ||
                song.category.toLowerCase().includes(query) || 
                (currentLanguage === 'en' && t(song.category, 'categories').toLowerCase().includes(query))
            );
            // 高亮函数
            function highlight(text) {
                if (!query) return text;
                // 支持中英文关键词高亮
                const reg = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                return text.replace(reg, '<span class="search-highlight">$1</span>');
            }
            // 显示搜索结果
            searchResultsList.innerHTML = '';
            if (matchedSongs.length > 0) {
                // 存储当前歌曲列表，用于导航
                currentState.currentSongList = matchedSongs;
                matchedSongs.forEach((song, index) => {
                    const songElement = document.createElement('div');
                    songElement.className = 'song-item';
                    songElement.innerHTML = `
                        <div class="song-category">${highlight(t(song.category, 'categories') + ' ' + song.id)}</div>
                        <div class="song-title">${highlight(song.title)}</div>
                    `;
                    songElement.addEventListener('click', () => {
                        showSong(song.category, song);
                        // 不再清除搜索结果和搜索框
                    });
                    searchResultsList.appendChild(songElement);
                });
            } else {
                const noResults = document.createElement('div');
                noResults.className = 'no-results';
                noResults.textContent = t('noMatchingSongs');
                searchResultsList.appendChild(noResults);
            }
            searchResults.classList.add('show');
            // 隐藏主界面内容
            categoriesContainer.style.display = 'none';
            weeklyButton.style.display = 'none';
            versionPreferenceContainer.style.display = 'none';
            // 隐藏历史/收藏按钮
            historyButton.style.display = 'none';
            // 添加搜索激活标志
            document.body.classList.add('search-active');
        }
        
        // 防抖函数
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        // 同步canvas尺寸到图片
        function syncDoodleCanvasSize() {
            if (!sheetImage.complete || sheetImage.naturalWidth === 0) return;
            // 最大分辨率
            const MAX_CANVAS_WIDTH = 875;
            const MAX_CANVAS_HEIGHT = 1400;
            let scale = Math.min(
                1,
                MAX_CANVAS_WIDTH / sheetImage.naturalWidth,
                MAX_CANVAS_HEIGHT / sheetImage.naturalHeight
            );
            // 缩放后的画布尺寸
            const canvasWidth = Math.round(sheetImage.naturalWidth * scale);
            const canvasHeight = Math.round(sheetImage.naturalHeight * scale);

            doodleCanvas.width = canvasWidth;
            doodleCanvas.height = canvasHeight;
            doodleCanvas.style.width = sheetImage.width + 'px';
            doodleCanvas.style.height = sheetImage.height + 'px';
            doodleCanvas.style.display = 'block'; // 始终显示
            doodleCanvas.style.pointerEvents = isDoodleMode ? 'auto' : 'none';
            // 预览canvas同步
            doodlePreviewCanvas.width = canvasWidth;
            doodlePreviewCanvas.height = canvasHeight;
            doodlePreviewCanvas.style.width = sheetImage.width + 'px';
            doodlePreviewCanvas.style.height = sheetImage.height + 'px';
            doodlePreviewCanvas.style.display = isDoodleMode ? 'block' : 'none';
            // 记录缩放比例
            doodleCanvas._scale = scale;
            // 重新加载本地涂鸦
            loadDoodleFromStorage();
        }
