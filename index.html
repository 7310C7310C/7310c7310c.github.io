<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>复活计划乐队</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans', 'Roboto', 'Arial';
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        
        body {
            background-color: #f5f1e8;
            color: #5a4a3a;
            min-height: 100vh;
            transition: background-color 0.3s;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 主界面样式 */
        #main-view {
            display: block;
        }
        
        .main-title {
            text-align: center;
            margin: 30px 0 20px;
            font-size: 2.5rem;
            color: #8c6a4d;
            letter-spacing: 2px;
        }
        
        .categories-list {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 10px;
        }
        
        .category-card {
            background-color: #e8dfd3;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
            padding-bottom: 15px;
        }
        
        .category-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .category-card h2 {
            margin-bottom: 10px;
            color: #6b4f3b;
        }
        
        /* 确保按钮和 div 表现一致 */
        button.category-card {
            border: none; /* 去掉默认边框 */
            width: 100%; /* 和分类卡片一样宽 */
            font-family: inherit; /* 继承字体 */
            font-size: inherit; /* 继承字号 */
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            margin-bottom: 15px; /* 和分类卡片一样的间距 */
        }
        
        /* 只覆盖本周歌曲按钮的背景色 */
        #weeklyButton.category-card {
            background-color: #c1b1a375; /* 略深的颜色 */
        }
        
        /* 分类界面样式 */
        #category-view {
            display: none;
        }
        
        /* 本周歌曲界面样式 */
        #weekly-view {
            display: none;
        }
        
        .back-button {
            background-color: #d4c8b8;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            margin-bottom: 30px;
            cursor: pointer;
            font-size: 1rem;
            color: #5a4a3a;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        #categoryTitle, #weeklyTitle {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.8rem;
            color: #8c6a4d;
        }
        
        .update-date {
            text-align: center;
            margin-bottom: 20px;
            color: #8c6a4d;
            font-style: italic;
        }
        
        .songs-list {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 0 20px;
        }
        
        .song-item {
            background-color: #e8dfd3;
            padding: 15px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            margin-bottom: 12px;
            padding-bottom: 12px;
        }
        
        .song-item:hover {
            background-color: #d9cdbc;
        }
        
        .song-number {
            font-weight: bold;
            margin-right: 15px;
            color: #8c6a4d;
            min-width: 35px;
        }
        
        .song-category {
            background-color: #8c6a4d;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 15px;
        }
        
        /* 乐谱查看器样式 */
        #viewer-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            z-index: 100;
            flex-direction: column;
        }
        
        .viewer-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow-y: auto;
            padding: 0;
        }
        
        .sheet-container {
            position: relative;
            max-width: 800px;
            margin: 0;
        }
        
        .sheet-image {
            display: block;
            transition: all 0.3s ease;
            width: 100%;
            height: auto;
            max-width: 100%;
        }
        
        /* 页码指示器和版本按钮容器 */
        .page-controls-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            z-index: 110;
        }
        
        .version-toggle-button {
            background-color: rgba(0,0,0,0.5);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 20px 0 0 20px;
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.2s;
            height: 32px;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }
        
        .version-toggle-button:hover {
            opacity: 1;
            background-color: rgba(0,0,0,0.7);
        }
        
        .version-toggle-button .arrow {
            margin-left: 5px;
            transition: transform 0.2s;
            font-size: 0.8rem;
        }
        
        .page-indicator-container {
            display: flex;
            align-items: center;
            background-color: rgba(0,0,0,0.5);
            border-radius: 0 20px 20px 0;
            padding: 5px 10px;
            height: 32px;
        }
        
        .page-nav {
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.7;
            padding: 0 8px;
            user-select: none;
        }
        
        .page-nav:hover {
            opacity: 1;
        }
        
        .page-indicator {
            color: white;
            text-align: center;
            padding: 0 10px;
            font-size: 0.9rem;
        }
        
        .version-buttons {
            position: absolute;
            bottom: 40px;
            left: 0;
            display: none;
            flex-direction: column;
            gap: 5px;
            background-color: rgba(0,0,0,0.7);
            border-radius: 8px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 120;
        }
        
        .version-buttons.show {
            display: flex;
        }
        
        .version-button {
            background-color: transparent;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
            text-align: left;
            white-space: nowrap;
            font-size: 0.9rem;
        }
        
        .version-button:hover {
            opacity: 1;
            background-color: rgba(255,255,255,0.1);
        }
        
        .version-button.active {
            opacity: 1;
            background-color: rgba(140, 106, 77, 0.7);
        }
        
        .close-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0,0,0,0.5);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 110;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        
        .close-button:hover {
            opacity: 1;
            background-color: rgba(0,0,0,0.7);
        }
        
        /* 优先显示选项 */
        .version-select {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #d4c8b8;
            background-color: #f5f1e8;
            color: #5a4a3a;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .version-select:hover {
            border-color: #8c6a4d;
        }
        
        .version-select:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(140, 106, 77, 0.2);
        }
        
        .version-preference {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
            gap: 10px;
        }
        
        /* 搜索框样式 */
        .search-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
            width: 100%;
        }
        
        .search-box {
            position: relative;
            width: 90%;
            max-width: 500px;
        }
        
        .search-input {
            width: 100%;
            padding: 10px 15px;
            padding-right: 70px;
            border-radius: 20px;
            border: 1px solid #d4c8b8;
            background-color: #f5f1e8;
            color: #5a4a3a;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .search-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(140, 106, 77, 0.2);
            border-color: #8c6a4d;
        }
        
        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #8c6a4d;
            pointer-events: none;
        }
        
        .clear-search {
            position: absolute;
            right: 45px;
            top: 50%;
            transform: translateY(-50%);
            color: #8c6a4d;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease;
            background: none;
            border: none;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 2;
        }
        
        .clear-search:hover {
            color: #5a4a3a;
        }
        
        .clear-search.visible {
            opacity: 0.7;
            pointer-events: auto;
        }
        
        .clear-search.visible:hover {
            opacity: 1;
        }
        
        .search-results {
            display: none;
            margin-top: 20px;
        }
        
        .search-results.show {
            display: block;
        }
        
        .search-results-title {
            text-align: center;
            color: #8c6a4d;
            margin-bottom: 15px;
        }
        
        .no-results {
            text-align: center;
            color: #5a4a3a;
            padding: 20px;
            font-style: italic;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-title {
                font-size: 2rem;
                margin: 20px 0 30px;
            }
            
            .category-card {
                padding: 20px;
            }
            
            #categoryTitle, #weeklyTitle {
                font-size: 1.5rem;
                margin-bottom: 25px;
            }
            
            .close-button {
                width: 35px;
                height: 35px;
                font-size: 1.2rem;
            }
            
            .version-toggle-button {
                font-size: 0.8rem;
                padding: 5px 8px;
            }
            
            .page-indicator {
                font-size: 0.8rem;
            }
            
            .song-category {
                margin-right: 10px;
                font-size: 0.7rem;
            }
            
            .search-input {
                padding: 8px 12px;
                padding-right: 65px;
                font-size: 0.9rem;
            }
            
            .search-icon {
                right: 12px;
            }
            
            .search-container {
                margin: 10px 0;
            }

            .loading-indicator {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                color: white;
                font-size: 1.2rem;
                z-index: 105;
                display: none;
            }

            .loading-spinner {
                border: 4px solid rgba(255, 255, 255, 0.3);
                border-radius: 50%;
                border-top: 4px solid white;
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
                margin: 0 auto 10px;
            }

            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }

            /* 在查看器背景上添加半透明遮罩 */
            .loading-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.7);
                z-index: 104;
                display: none;
            }

            .clear-search {
                right: 38px;
                width: 22px;
                height: 22px;
                font-size: 1.1rem;
            }
        }
        
        /* 最近查看和临时收藏区域样式 */
        .section-title {
            text-align: center;
            color: #8c6a4d;
            margin: 25px 0 15px;
            font-size: 1.5rem;
            position: relative;
        }
        
        .section-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 25px 0 15px;
            position: relative;
        }
        
        .section-header .section-title {
            margin: 0;
        }
        
        .clear-button {
            position: absolute;
            right: 0;
            background: none;
            border: none;
            color: #8c6a4d;
            font-size: 0.9rem;
            cursor: pointer;
            opacity: 0.7;
            padding: 5px 10px;
            transition: opacity 0.2s;
        }
        
        .clear-button:hover {
            opacity: 1;
            text-decoration: underline;
        }
        
        .recently-viewed-container,
        .temp-favorites-container {
            margin-bottom: 20px;
        }
        
        .empty-list-message {
            text-align: center;
            padding: 15px;
            color: #8c6a4d;
            font-style: italic;
        }
        
        /* 临时收藏按钮样式 */
        .favorite-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: rgba(0,0,0,0.5);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 110;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        
        .favorite-button:hover {
            opacity: 1;
            background-color: rgba(0,0,0,0.7);
        }
        
        .favorite-button.active svg {
            fill: #ff5e5e;
            stroke: #ff5e5e;
        }
        
        /* 收藏项目的取消收藏按钮 */
        .unfavorite-button {
            background: none;
            border: none;
            color: #8c6a4d;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 10px;
            transition: all 0.2s;
        }
        
        .unfavorite-button svg {
            width: 16px;
            height: 16px;
            fill: #ff5e5e;
            stroke: #ff5e5e;
            transition: all 0.2s;
        }
        
        .unfavorite-button:hover {
            background-color: rgba(255, 94, 94, 0.1);
            transform: scale(1.1);
        }
        
        /* 收藏项目布局 */
        .favorite-item {
            display: flex;
            align-items: center;
        }
        
        .favorite-item .song-info {
            flex: 1;
            display: flex;
        }
        
        .favorite-item .song-category {
            margin-right: 15px;
        }
        
        @media (max-width: 768px) {
            .favorite-button {
                width: 35px;
                height: 35px;
                top: 15px;
                left: 15px;
            }
            
            .section-title {
                font-size: 1.3rem;
            }
            
            .clear-button {
                font-size: 0.8rem;
            }
        }
        
        /* 最近查看和收藏区域样式 */
        .section-title {
            text-align: center;
            color: #8c6a4d;
            margin: 25px 0 15px;
            font-size: 1.5rem;
            position: relative;
        }
        
        .section-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 25px 0 15px;
            position: relative;
        }
        
        .section-header .section-title {
            margin: 0;
        }
        
        .clear-button {
            position: absolute;
            right: 0;
            background: none;
            border: none;
            color: #8c6a4d;
            font-size: 0.9rem;
            cursor: pointer;
            opacity: 0.7;
            padding: 5px 10px;
            transition: opacity 0.2s;
        }
        
        .clear-button:hover {
            opacity: 1;
            text-decoration: underline;
        }
        
        .history-panel-container {
            position: fixed;
            top: 0;
            right: 0;
            width: 320px;
            height: 100vh;
            background-color: rgba(245, 241, 232, 0.97);
            box-shadow: -3px 0 10px rgba(0, 0, 0, 0.15);
            z-index: 150;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .history-panel-container.show {
            transform: translateX(0);
        }
        
        .history-panel-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(140, 106, 77, 0.2);
        }
        
        .history-panel-title {
            font-size: 1.3rem;
            color: #8c6a4d;
            margin: 0;
        }
        
        .history-panel-close {
            background: none;
            border: none;
            color: #8c6a4d;
            font-size: 1.5rem;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            transition: background-color 0.2s;
        }
        
        .history-panel-close:hover {
            background-color: rgba(140, 106, 77, 0.1);
        }
        
        .history-panel-content {
            padding: 0 15px 20px;
            flex: 1;
            overflow-y: auto;
        }
        
        .history-tab-container {
            display: flex;
            border-bottom: 1px solid rgba(140, 106, 77, 0.2);
            margin: 0 -15px 15px;
        }
        
        .history-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            color: #8c6a4d;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        
        .history-tab.active {
            border-bottom: 2px solid #8c6a4d;
            background-color: rgba(140, 106, 77, 0.1);
        }
        
        .history-tab:hover {
            background-color: rgba(140, 106, 77, 0.05);
        }
        
        .history-tab-panel {
            display: none;
        }
        
        .history-tab-panel.active {
            display: block;
        }
        
        .history-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(140, 106, 77, 0.7);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 110;
            transition: background-color 0.2s, transform 0.2s;
        }
        
        .history-button:hover {
            background-color: rgba(140, 106, 77, 0.9);
            transform: scale(1.05);
        }
        
        .history-button svg {
            width: 24px;
            height: 24px;
        }
        
        .recently-viewed-container,
        .favorites-container {
            margin-bottom: 20px;
        }
        
        .empty-list-message {
            text-align: center;
            padding: 15px;
            color: #8c6a4d;
            font-style: italic;
        }
        
        /* 收藏按钮样式 */
        .favorite-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: rgba(0,0,0,0.5);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 110;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        
        .favorite-button:hover {
            opacity: 1;
            background-color: rgba(0,0,0,0.7);
        }
        
        .favorite-button.active svg {
            fill: #ff5e5e;
            stroke: #ff5e5e;
        }
        
        @media (max-width: 768px) {
            .favorite-button {
                width: 35px;
                height: 35px;
                top: 15px;
                left: 15px;
            }
            
            .history-button {
                width: 40px;
                height: 40px;
                top: 15px;
                right: 15px;
            }
            
            .history-button svg {
                width: 20px;
                height: 20px;
            }
            
            .history-panel-container {
                width: 100%;
            }
            
            .section-title {
                font-size: 1.3rem;
            }
            
            .clear-button {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- 主界面 -->
    <div id="main-view" class="container">
        <h1 class="main-title">复活计划乐队</h1>
        
        <div class="search-container">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索歌曲……" autocomplete="off">
                <div class="search-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <div class="clear-search" id="clearSearch">×</div>
            </div>
        </div>
        
        <div class="search-results" id="searchResults">
            <h3 class="search-results-title">搜索结果</h3>
            <div class="songs-list" id="searchResultsList">
                <!-- 搜索结果将通过JS动态加载 -->

            // 键名
            keys: {
                recentlyViewed: 'fhj_recently_viewed',
                favorites: 'fhj_favorites'
            },
            
            // 初始化存储
            initialize() {
                // 如果本地存储中没有数据，创建初始结构
                if (!localStorage.getItem(this.keys.recentlyViewed)) {
                    localStorage.setItem(this.keys.recentlyViewed, JSON.stringify({
                        items: [],
                        maxItems: 10
                    }));
                }
                
                if (!localStorage.getItem(this.keys.favorites)) {
                    localStorage.setItem(this.keys.favorites, JSON.stringify({
                        items: []
                    }));
                }
                
                // 兼容旧版本：将临时收藏迁移到收藏
                const oldKey = 'fhj_temp_favorites';
                if (localStorage.getItem(oldKey)) {
                    try {
                        const oldData = JSON.parse(localStorage.getItem(oldKey));
                        if (oldData && oldData.items && oldData.items.length > 0) {
                            const favoritesData = this.getFavorites();
                            // 合并数据，避免重复
                            oldData.items.forEach(item => {
                                if (!favoritesData.items.some(
                                    f => f.id === item.id && f.category === item.category
                                )) {
                                    favoritesData.items.push(item);
                                }
                            });
                            localStorage.setItem(this.keys.favorites, JSON.stringify(favoritesData));
                        }
                        // 删除旧数据
                        localStorage.removeItem(oldKey);
                    } catch (e) {
                        console.error('迁移旧收藏数据失败', e);
                    }
                }
            },
            
            // 获取最近查看记录
            getRecentlyViewed() {
                try {
                    return JSON.parse(localStorage.getItem(this.keys.recentlyViewed));
                } catch (e) {
                    console.error('获取最近查看记录失败', e);
                    return { items: [], maxItems: 10 };
                }
            },

                try {
                    const recentlyViewed = this.getRecentlyViewed();
                    
                    // 检查是否已存在，如果存在则删除旧记录
                    const existingIndex = recentlyViewed.items.findIndex(
                        item => item.id === song.id && item.category === category
                    );
                    
                    if (existingIndex !== -1) {
                        recentlyViewed.items.splice(existingIndex, 1);
                    }
                    
                    // 添加新记录到开头
                    recentlyViewed.items.unshift({
                        id: song.id,
                        title: song.title,
                        category: category,
                        timestamp: Date.now()
                    });
                    
                    // 如果超过最大数量，删除最旧的
                    if (recentlyViewed.items.length > recentlyViewed.maxItems) {
                        recentlyViewed.items.pop();
                    }
                    
                    // 保存到本地存储
                    localStorage.setItem(this.keys.recentlyViewed, JSON.stringify(recentlyViewed));
                    return true;
                } catch (e) {
                    console.error('添加最近查看记录失败', e);
                    return false;
                }
            },
            
            // 清空最近查看记录
            clearRecentlyViewed() {
                try {
                    localStorage.setItem(this.keys.recentlyViewed, JSON.stringify({
                        items: [],
                        maxItems: 10
                    }));
                    return true;
                } catch (e) {
                    console.error('清空最近查看记录失败', e);
                    return false;
                }
            },
            
            // 获取收藏
            getFavorites() {
                try {
                    return JSON.parse(localStorage.getItem(this.keys.favorites));
                } catch (e) {
                    console.error('获取收藏失败', e);
                    return { items: [] };
                }
            },
            
            // 添加/移除收藏
            toggleFavorite(song, category) {
                try {
                    const favorites = this.getFavorites();
                    
                    // 检查是否已经收藏
                    const existingIndex = favorites.items.findIndex(
                        item => item.id === song.id && item.category === category
                    );
                    
                    // 如果已存在，则移除
                    if (existingIndex !== -1) {
                        favorites.items.splice(existingIndex, 1);
                        localStorage.setItem(this.keys.favorites, JSON.stringify(favorites));
                        return false; // 返回false表示已取消收藏
                    }
                    
                    // 如果不存在，添加到收藏
                    favorites.items.push({
                        id: song.id,
                        title: song.title,
                        category: category,
                        timestamp: Date.now()
                    });
                    
                    // 保存到本地存储
                    localStorage.setItem(this.keys.favorites, JSON.stringify(favorites));
                    return true; // 返回true表示已添加收藏
                } catch (e) {
                    console.error('切换收藏状态失败', e);
                    return null;
                }
            },
            
            // 清空收藏
            clearFavorites() {
                try {
                    localStorage.setItem(this.keys.favorites, JSON.stringify({
                        items: []
                    }));
                    return true;
                } catch (e) {
                    console.error('清空收藏失败', e);
                    return false;
                }
            },
            
            // 检查是否已收藏
            isFavorite(songId, category) {
                try {
                    const favorites = this.getFavorites();
                    return favorites.items.some(
                        item => item.id === songId && item.category === category
                    );
                } catch (e) {
                    console.error('检查收藏状态失败', e);
                    return false;
                }
            }
        };

        // DOM元素

        // 初始化应用
        function initApp() {
            // 初始添加一个历史记录
            history.replaceState(null, null);
            
            // 初始化本地存储
            storageManager.initialize();
            
            renderCategories();
            renderVersionPreference();
            setupEventListeners();
            setupSearchFunction();
            
            // 渲染最近查看和收藏
            renderRecentlyViewed();
            renderFavorites();
            
            loadingOverlay.style.display = 'none';
            loadingIndicator.style.display = 'none';
        }

        // 渲染分类列表
        function renderCategories() {
            categoriesContainer.innerHTML = '';
            songsData.categories.forEach(category => {
                const categoryElement = document.createElement('div');
                categoryElement.className = 'category-card';
                categoryElement.innerHTML = `
                    <h2>${category.name}</h2>
                    <p>${category.songs.length} 首歌曲</p>
                `;
                categoryElement.addEventListener('click', () => showCategory(category.name));
                categoriesContainer.appendChild(categoryElement);
            });
        }

        // 渲染版本偏好选项
        function renderVersionPreference() {
            // 收集所有可用的版本
            const allVersions = new Set();
            songsData.categories.forEach(category => {
                category.songs.forEach(song => {
                    song.versions.forEach(version => {
                        allVersions.add(version);
                    });
                });
            });
            
            const versionSelect = document.getElementById('versionSelect');
            versionSelect.innerHTML = '';
            
            // 添加原谱选项
            const originalOption = document.createElement('option');
            originalOption.value = "原谱";
            originalOption.textContent = "原谱";
            originalOption.selected = currentState.preferredVersion === '原谱';
            versionSelect.appendChild(originalOption);
            
            // 添加其他版本选项
            Array.from(allVersions).forEach(version => {
                const option = document.createElement('option');
                option.value = version;
                option.textContent = version;
                option.selected = currentState.preferredVersion === version;
                versionSelect.appendChild(option);
            });
            
            // 添加事件监听
            versionSelect.addEventListener('change', () => {
                currentState.preferredVersion = versionSelect.value;
            });
        }

        // 显示分类下的歌曲
        function showCategory(categoryName) {
            const category = songsData.categories.find(c => c.name === categoryName);
            if (!category) return;

            currentState.currentCategory = categoryName;
            categoryTitle.textContent = categoryName;
            songsContainer.innerHTML = '';

            category.songs.forEach((song) => {
                const songElement = document.createElement('div');
                songElement.className = 'song-item';
                songElement.innerHTML = `
                    <div class="song-number">${song.id}</div>
                    <div class="song-title">${song.title}</div>
                `;
                songElement.addEventListener('click', () => showSong(categoryName, song));
                songsContainer.appendChild(songElement);
            });

            mainView.style.display = 'none';
            categoryView.style.display = 'block';
            
            // 隐藏历史按钮
            historyButton.style.display = 'none';
        }

        // 显示本周歌曲
        function showWeeklySongs() {
            currentState.openedFrom = null;
            updateDate.textContent = `更新日期：${songsData.weeklySongs.updateDate}`;
            weeklySongsContainer.innerHTML = '';
            
            songsData.weeklySongs.songs.forEach((song, index) => {
                const category = songsData.categories.find(c => c.name === song.category);
                if (!category) return;
                
                const fullSong = category.songs.find(s => s.id === song.id);
                if (!fullSong) return;
                
                const songElement = document.createElement('div');
                songElement.className = 'song-item';
                songElement.innerHTML = `
                    <div class="song-category">${song.category} ${song.id}</div>
                    <div class="song-title">${song.title}</div>
                `;
                songElement.addEventListener('click', () => showSong(song.category, fullSong));
                weeklySongsContainer.appendChild(songElement);
            });

            mainView.style.display = 'none';
            weeklyView.style.display = 'block';
            
            // 隐藏历史按钮
            historyButton.style.display = 'none';
        }

        // 显示乐谱
        function showSong(categoryName, song) {
            loadingOverlay.style.display = 'none';
            loadingIndicator.style.display = 'none';
            
            // 记录是从哪个界面打开的
            if (weeklyView.style.display === 'block') {
                currentState.openedFrom = 'weekly';
            } else if (categoryView.style.display === 'block') {
                currentState.openedFrom = 'category';
            } else if (searchResults.classList.contains('show')) {
                currentState.openedFrom = 'search';
            } else if (historyPanel.classList.contains('show')) {
                currentState.openedFrom = 'history';
            }
            
            // 添加到最近查看记录
            storageManager.addToRecentlyViewed(song, categoryName);
            
            currentState.currentCategory = categoryName;
            currentState.currentSong = song;
            currentState.currentPage = 1;
            currentState.totalPages = song.pages;
            currentState.availableVersions = ['原谱', ...song.versions];
            
            // 根据偏好设置当前版本
            if (song.versions.includes(currentState.preferredVersion)) {
                currentState.currentVersion = currentState.preferredVersion;
            } else {
                currentState.currentVersion = '原谱';
            }

            loadImage(currentState.currentPage);
            updatePageIndicator();
            renderVersionButtons();
            
            // 检查是否已收藏并更新收藏按钮状态
            if (storageManager.isFavorite(song.id, categoryName)) {
                favoriteButton.classList.add('active');
            } else {
                favoriteButton.classList.remove('active');
            }

            categoryView.style.display = 'none';
            weeklyView.style.display = 'none';
            viewerView.style.display = 'flex';
            
            // 无论从哪个界面打开，在查看乐谱时都隐藏历史按钮
            historyButton.style.display = 'none';
            
            // 滚动到顶部
            document.querySelector('.viewer-content').scrollTop = 0;
            
            // 添加历史记录
            history.pushState({viewingSheet: true}, null);
        }

        // 加载乐谱图片
        function loadImage(page) {
            // 显示加载指示器
            loadingOverlay.style.display = 'block';
            loadingIndicator.style.display = 'block';
            
            // 先清除图片源
            sheetImage.src = '';
            
            let imagePath;
            if (currentState.currentVersion === '原谱') {
                imagePath = `img/${currentState.currentCategory}/${currentState.currentSong.filename}_${page}.jpeg`;
            } else {
                imagePath = `img/${currentState.currentCategory}/${currentState.currentSong.filename}_${currentState.currentVersion}_${page}.jpeg`;
            }
            
            // 图片加载完成时隐藏指示器
            sheetImage.onload = function() {
                loadingOverlay.style.display = 'none';
                loadingIndicator.style.display = 'none';
            };
            
            // 图片加载出错时也隐藏指示器
            sheetImage.onerror = function() {
                loadingOverlay.style.display = 'none';
                loadingIndicator.style.display = 'none';
                // 可以在这里添加错误处理，比如显示一个错误消息
            };
            
            sheetImage.src = imagePath;
            
            // 预加载相邻页面（保持原有逻辑）
            if (page < currentState.totalPages) {
                const nextImage = new Image();
                if (currentState.currentVersion === '原谱') {
                    nextImage.src = `img/${currentState.currentCategory}/${currentState.currentSong.filename}_${page + 1}.jpeg`;
                } else {
                    nextImage.src = `img/${currentState.currentCategory}/${currentState.currentSong.filename}_${currentState.currentVersion}_${page + 1}.jpeg`;
                }
            }
            if (page > 1) {
                const prevImage = new Image();
                if (currentState.currentVersion === '原谱') {
                    prevImage.src = `img/${currentState.currentCategory}/${currentState.currentSong.filename}_${page - 1}.jpeg`;
                } else {
                    prevImage.src = `img/${currentState.currentCategory}/${currentState.currentSong.filename}_${currentState.currentVersion}_${page - 1}.jpeg`;
                }
            }
        }

        // 渲染版本切换按钮
        function renderVersionButtons() {
            versionButtonsContainer.innerHTML = '';
            
            // 总是显示版本切换按钮，即使只有原谱
            currentState.availableVersions.forEach(version => {
                const button = document.createElement('button');
                button.className = 'version-button';
                button.textContent = version;
                if (version === currentState.currentVersion) {
                    button.classList.add('active');
                }
                button.addEventListener('click', () => {
                    if (version !== currentState.currentVersion) {
                        currentState.currentVersion = version;
                        currentState.currentPage = 1;
                        loadImage(currentState.currentPage);
                        updatePageIndicator();
                        renderVersionButtons();
                        // 关闭折叠菜单
                        versionButtonsContainer.classList.remove('show');
                        // 更新箭头方向
                        document.querySelector('.version-toggle-button .arrow').textContent = '▼';
                    }
                });
                versionButtonsContainer.appendChild(button);
            });
            
            // 更新切换按钮文本
            versionButtonText.textContent = currentState.currentVersion;
            const arrow = versionToggleButton.querySelector('.arrow') || document.createElement('span');
            arrow.className = 'arrow';
            arrow.textContent = '▼';
            versionToggleButton.appendChild(arrow);
            
            // 总是显示版本切换按钮
            versionToggleButton.style.display = 'flex';
        }

        // 更新页码指示器
        function updatePageIndicator() {
            pageIndicator.textContent = `${currentState.currentPage} / ${currentState.totalPages}`;
        }

        // 关闭查看器
        function closeViewer() {
            loadingOverlay.style.display = 'none';
            loadingIndicator.style.display = 'none';
            viewerView.style.display = 'none';
            
            // 添加一个状态标记来记录是从哪个界面打开的查看器
            if (currentState.openedFrom === 'weekly') {
                weeklyView.style.display = 'block';
                // 周歌曲界面不显示历史按钮
                historyButton.style.display = 'none';
            } else if (currentState.openedFrom === 'category') {
                categoryView.style.display = 'block';
                // 分类界面不显示历史按钮
                historyButton.style.display = 'none';
            } else if (currentState.openedFrom === 'search') {
                // 从搜索结果回来，保持搜索结果显示
                searchResults.classList.add('show');
                categoriesContainer.style.display = 'none';
                weeklyButton.style.display = 'none';
                versionPreferenceContainer.style.display = 'none';
                mainView.style.display = 'block';
                currentState.isSearchActive = true;
                
                // 确保搜索框仍然有值
                if (searchInput.value.trim() === '' && currentState.lastSearchQuery) {
                    searchInput.value = currentState.lastSearchQuery;
                }
                
                // 搜索结果界面不显示历史按钮
                historyButton.style.display = 'none';
            } else if (currentState.openedFrom === 'history') {
                // 从历史/收藏面板回来，返回主界面
                mainView.style.display = 'block';
                // 主界面显示历史按钮
                historyButton.style.display = 'flex';
            } else {
                mainView.style.display = 'block';
                // 主界面显示历史按钮
                historyButton.style.display = 'flex';
            }
            
            // 更新最近查看和收藏列表
            renderRecentlyViewed();
            renderFavorites();
            
            // 清除打开来源标记
            currentState.openedFrom = null;
            history.replaceState(null, null);
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 返回按钮
            backButton.addEventListener('click', () => {
                categoryView.style.display = 'none';
                mainView.style.display = 'block';
                // 返回主界面时显示历史按钮
                historyButton.style.display = 'flex';
            });
            
            // 本周歌曲返回按钮
            backButtonWeekly.addEventListener('click', () => {
                weeklyView.style.display = 'none';
                mainView.style.display = 'block';
                // 返回主界面时显示历史按钮
                historyButton.style.display = 'flex';
            });

            // 关闭查看器按钮
            closeViewerButton.addEventListener('click', closeViewer);

            // 点击乐谱外区域关闭查看器
            viewerContent.addEventListener('click', (e) => {
                if (e.target === viewerContent) {
                    closeViewer();
                }
            });

            // 翻页按钮
            prevPageButton.addEventListener('click', () => {
                goToPrevPage();
            });

            nextPageButton.addEventListener('click', () => {
                goToNextPage();
            });

            // 版本切换按钮点击事件
            versionToggleButton.addEventListener('click', (e) => {
                e.stopPropagation();
                versionButtonsContainer.classList.toggle('show');
                const arrow = versionToggleButton.querySelector('.arrow');
                if (versionButtonsContainer.classList.contains('show')) {
                    arrow.textContent = '▲';
                } else {
                    arrow.textContent = '▼';
                }
            });

            // 点击页面其他地方关闭版本选择菜单
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.version-buttons-container') && 
                    !e.target.closest('.version-buttons')) {
                    versionButtonsContainer.classList.remove('show');
                    const arrow = versionToggleButton.querySelector('.arrow');
                    if (arrow) arrow.textContent = '▼';
                }
            });

            // 本周歌曲按钮点击事件
            weeklyButton.addEventListener('click', showWeeklySongs);

            // 监听返回键（针对移动设备）
            window.addEventListener('popstate', function(event) {
                if (viewerView.style.display === 'flex') {
                    // 如果正在查看乐谱，则关闭查看器而不退出页面
                    closeViewer();
                    // 阻止默认的返回行为
                    history.pushState(null, null, document.URL);
                    event.preventDefault();
                } else if (categoryView.style.display === 'block') {
                    // 如果在分类视图，返回主视图
                    categoryView.style.display = 'none';
                    mainView.style.display = 'block';
                    // 返回主界面时显示历史按钮
                    historyButton.style.display = 'flex';
                    history.pushState(null, null, document.URL);
                    event.preventDefault();
                } else if (weeklyView.style.display === 'block') {
                    // 如果在本周歌曲视图，返回主视图
                    weeklyView.style.display = 'none';
                    mainView.style.display = 'block';
                    // 返回主界面时显示历史按钮
                    historyButton.style.display = 'flex';
                    history.pushState(null, null, document.URL);
                    event.preventDefault();
                } else if (currentState.isSearchActive && searchResults.classList.contains('show')) {
                    // 如果在搜索结果视图，清除搜索并返回主视图
                    searchInput.value = '';
                    searchResults.classList.remove('show');
                    categoriesContainer.style.display = '';
                    weeklyButton.style.display = '';
                    versionPreferenceContainer.style.display = '';
                    currentState.isSearchActive = false;
                    history.pushState(null, null, document.URL);
                    event.preventDefault();
                }
            });

            // 上一页函数
            function goToPrevPage() {
                if (currentState.currentPage > 1) {
                    currentState.currentPage--;
                    loadImage(currentState.currentPage);
                    updatePageIndicator();
                    // 滚动到顶部
                    document.querySelector('.viewer-content').scrollTop = 0;
                }
            }

            // 下一页函数
            function goToNextPage() {
                if (currentState.currentPage < currentState.totalPages) {
                    currentState.currentPage++;
                    loadImage(currentState.currentPage);
                    updatePageIndicator();
                    // 滚动到顶部
                    document.querySelector('.viewer-content').scrollTop = 0;
                }
            }

            // 触摸滑动翻页
            let touchStartX = 0;
            let touchEndX = 0;
            
            document.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, false);

            document.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, false);

            function handleSwipe() {
                if (!viewerView.style.display || viewerView.style.display === 'none') return;
                
                const threshold = 50; // 最小滑动距离
                const diff = touchStartX - touchEndX;
                
                if (diff > threshold) {
                    goToNextPage();
                } else if (diff < -threshold) {
                    goToPrevPage();
                }
            }

            // 键盘事件监听
            document.addEventListener('keydown', (e) => {
                // ESC键退出查看器
                if (e.key === 'Escape' && viewerView.style.display === 'flex') {
                    closeViewer();
                }
                
                // 左右方向键翻页
                if (viewerView.style.display === 'flex') {
                    if (e.key === 'ArrowLeft') {
                        goToPrevPage();
                    } else if (e.key === 'ArrowRight') {
                        goToNextPage();
                    }
                }
            });

            // 清除搜索按钮点击事件
            clearSearchButton.addEventListener('click', () => {
                searchInput.value = '';
                searchResults.classList.remove('show');
                categoriesContainer.style.display = '';
                weeklyButton.style.display = '';
                versionPreferenceContainer.style.display = '';
                currentState.isSearchActive = false;
                clearSearchButton.classList.remove('visible');
                
                // 在主界面显示历史/收藏按钮
                historyButton.style.display = 'flex';
                
                // 清除后让搜索框重新获得焦点
                searchInput.focus();
            });
            
            // 搜索框获得焦点时如果有内容则显示清除按钮
            searchInput.addEventListener('focus', () => {
                if (searchInput.value.trim() !== '') {
                    clearSearchButton.classList.add('visible');
                }
            });

            // 清空最近查看按钮
            clearRecentlyViewed.addEventListener('click', () => {
                if (confirm('确定要清空最近查看记录吗？')) {
                    storageManager.clearRecentlyViewed();
                    renderRecentlyViewed();
                }
            });
            
            // 收藏按钮点击事件
            favoriteButton.addEventListener('click', (e) => {
                e.stopPropagation(); // 防止事件冒泡
                
                if (!currentState.currentSong) return;
                
                const isFavorited = storageManager.toggleFavorite(
                    currentState.currentSong, 
                    currentState.currentCategory
                );
                
                // 更新按钮样式
                if (isFavorited) {
                    favoriteButton.classList.add('active');
                } else {
                    favoriteButton.classList.remove('active');
                }
                
                // 更新收藏列表（如果面板是打开的）
                if (historyPanel.classList.contains('show')) {
                    renderFavorites();
                }
            });
            
            // 历史面板相关事件
            historyButton.addEventListener('click', () => {
                historyPanel.classList.add('show');
                // 刷新数据
                renderRecentlyViewed();
                renderFavorites();
            });
            
            historyPanelClose.addEventListener('click', () => {
                historyPanel.classList.remove('show');
            });
            
            // 点击面板外部关闭面板
            document.addEventListener('click', (e) => {
                if (historyPanel.classList.contains('show') && 
                    !historyPanel.contains(e.target) && 
                    !historyButton.contains(e.target)) {
                    historyPanel.classList.remove('show');
                }
            });
            
            // 标签切换
            recentTab.addEventListener('click', () => {
                recentTab.classList.add('active');
                favoritesTab.classList.remove('active');
                recentPanel.classList.add('active');
                favoritesPanel.classList.remove('active');
            });
            
            favoritesTab.addEventListener('click', () => {
                favoritesTab.classList.add('active');
                recentTab.classList.remove('active');
                favoritesPanel.classList.add('active');
                recentPanel.classList.remove('active');
            });
        }

        // 搜索功能
        function setupSearchFunction() {
            searchInput.addEventListener('input', debounce(performSearch, 300));
            
            // 监听输入变化，控制清除按钮显示
            searchInput.addEventListener('input', () => {
                if (searchInput.value.trim() !== '') {
                    clearSearchButton.classList.add('visible');
                } else {
                    clearSearchButton.classList.remove('visible');
                    
                    // 当搜索框内容为空时，隐藏搜索结果并显示主界面内容
                    searchResults.classList.remove('show');
                    categoriesContainer.style.display = '';
                    weeklyButton.style.display = '';
                    versionPreferenceContainer.style.display = '';
                    currentState.isSearchActive = false;
                    
                    // 显示历史/收藏按钮
                    historyButton.style.display = 'flex';
                }
            });
            
            // 初始检查搜索框是否有内容
            if (searchInput.value.trim() !== '') {
                clearSearchButton.classList.add('visible');
            }
            
            // 点击其他区域隐藏搜索结果
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-container') && 
                    !e.target.closest('.search-results')) {
                    if (currentState.isSearchActive) {
                        // 保存搜索状态但不要立即隐藏
                        currentState.isSearchActive = searchResults.classList.contains('show');
                        currentState.lastSearchQuery = searchInput.value.trim();
                    } else {
                        searchResults.classList.remove('show');
                        categoriesContainer.style.display = '';
                        weeklyButton.style.display = '';
                        versionPreferenceContainer.style.display = '';
                    }
                }
            });
            
            // 搜索框失焦时，如果无搜索内容则恢复显示主界面内容
            searchInput.addEventListener('blur', () => {
                if (searchInput.value.trim() === '' && searchResults.classList.contains('show')) {
                    setTimeout(() => {
                        searchResults.classList.remove('show');
                        categoriesContainer.style.display = '';
                        weeklyButton.style.display = '';
                        versionPreferenceContainer.style.display = '';
                        currentState.isSearchActive = false;
                        
                        // 在主界面显示历史/收藏按钮
                        historyButton.style.display = 'flex';
                    }, 200);
                }
            });
            
            // 清除搜索并恢复主界面
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchInput.value = '';
                    searchResults.classList.remove('show');
                    categoriesContainer.style.display = '';
                    weeklyButton.style.display = '';
                    versionPreferenceContainer.style.display = '';
                    searchInput.blur();
                    currentState.isSearchActive = false;
                    
                    // 在主界面显示历史/收藏按钮
                    historyButton.style.display = 'flex';
                    
                    // 隐藏清除按钮
                    clearSearchButton.classList.remove('visible');
                }
            });
        }
        
        // 执行搜索
        function performSearch() {
            const query = searchInput.value.trim().toLowerCase();
            if (query.length < 1) {
                searchResults.classList.remove('show');
                categoriesContainer.style.display = '';
                weeklyButton.style.display = '';
                versionPreferenceContainer.style.display = '';
                currentState.isSearchActive = false;
                return;
            }
            
            currentState.isSearchActive = true;
            currentState.lastSearchQuery = query;
            
            // 收集所有歌曲
            const allSongs = [];
            songsData.categories.forEach(category => {
                category.songs.forEach(song => {
                    allSongs.push({
                        category: category.name,
                        categoryId: category.name,
                        ...song
                    });
                });
            });
            
            // 过滤匹配的歌曲
            const matchedSongs = allSongs.filter(song => 
                song.title.toLowerCase().includes(query) || 
                song.id.toLowerCase().includes(query) ||
                song.category.toLowerCase().includes(query)
            );
            
            // 显示搜索结果
            searchResultsList.innerHTML = '';
            if (matchedSongs.length > 0) {
                matchedSongs.forEach((song, index) => {
                    const songElement = document.createElement('div');
                    songElement.className = 'song-item';
                    songElement.innerHTML = `
                        <div class="song-category">${song.category} ${song.id}</div>
                        <div class="song-title">${song.title}</div>
                    `;
                    songElement.addEventListener('click', () => {
                        showSong(song.category, song);
                        // 不再清除搜索结果和搜索框
                    });
                    searchResultsList.appendChild(songElement);
                });
            } else {
                const noResults = document.createElement('div');
                noResults.className = 'no-results';
                noResults.textContent = '没有找到匹配的歌曲';
                searchResultsList.appendChild(noResults);
            }
            
            searchResults.classList.add('show');
            // 隐藏主界面内容
            categoriesContainer.style.display = 'none';
            weeklyButton.style.display = 'none';
            versionPreferenceContainer.style.display = 'none';
            
            // 隐藏历史/收藏按钮
            historyButton.style.display = 'none';
        }
        
        // 防抖函数
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        // 渲染最近查看列表
        function renderRecentlyViewed() {
            const recentData = storageManager.getRecentlyViewed();
            
            // 如果没有最近查看记录，显示空消息
            if (recentData.items.length === 0) {
                recentlyViewedList.innerHTML = '<div class="empty-list-message">暂无记录</div>';
                return;
            }
            
            recentlyViewedList.innerHTML = '';
            
            // 添加最近查看的歌曲
            recentData.items.forEach((item) => {
                const songElement = document.createElement('div');
                songElement.className = 'song-item';
                songElement.innerHTML = `
                    <div class="song-category">${item.category} ${item.id}</div>
                    <div class="song-title">${item.title}</div>
                `;
                
                // 添加点击事件
                songElement.addEventListener('click', () => {
                    // 查找完整的歌曲信息
                    const category = songsData.categories.find(c => c.name === item.category);
                    if (!category) return;
                    
                    const song = category.songs.find(s => s.id === item.id);
                    if (!song) return;
                    
                    showSong(item.category, song);
                    // 关闭面板
                    historyPanel.classList.remove('show');
                });
                
                recentlyViewedList.appendChild(songElement);
            });
        }

        // 渲染收藏列表
        function renderFavorites() {
            const favoritesData = storageManager.getFavorites();
            
            // 如果没有收藏，显示空消息
            if (favoritesData.items.length === 0) {
                favoritesList.innerHTML = '<div class="empty-list-message">暂无收藏</div>';
                return;
            }
            
            favoritesList.innerHTML = '';
            
            // 添加收藏的歌曲
            favoritesData.items.forEach((item) => {
                const songElement = document.createElement('div');
                songElement.className = 'song-item favorite-item';
                
                // 创建歌曲信息容器
                const songInfo = document.createElement('div');
                songInfo.className = 'song-info';
                songInfo.innerHTML = `
                    <div class="song-category">${item.category} ${item.id}</div>
                    <div class="song-title">${item.title}</div>
                `;
                
                // 添加点击事件到歌曲信息
                songInfo.addEventListener('click', () => {
                    // 查找完整的歌曲信息
                    const category = songsData.categories.find(c => c.name === item.category);
                    if (!category) return;
                    
                    const song = category.songs.find(s => s.id === item.id);
                    if (!song) return;
                    
                    showSong(item.category, song);
                    // 关闭面板
                    historyPanel.classList.remove('show');
                });
                
                // 创建取消收藏按钮
                const unfavoriteButton = document.createElement('button');
                unfavoriteButton.className = 'unfavorite-button';
                unfavoriteButton.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
                    </svg>
                `;
                
                // 添加取消收藏点击事件
                unfavoriteButton.addEventListener('click', (e) => {
                    e.stopPropagation(); // 防止冒泡到歌曲点击
                    
                    // 查找完整的歌曲信息
                    const category = songsData.categories.find(c => c.name === item.category);
                    if (!category) return;
                    
                    const song = category.songs.find(s => s.id === item.id);
                    if (!song) return;
                    
                    // 移除收藏
                    storageManager.toggleFavorite(song, item.category);
                    
                    // 刷新收藏列表
                    renderFavorites();
                    
                    // 如果当前正在查看这首歌，更新收藏按钮状态
                    if (currentState.currentSong && 
                        currentState.currentSong.id === song.id && 
                        currentState.currentCategory === item.category) {
                        favoriteButton.classList.remove('active');
                    }
                });
                
                // 组装元素
                songElement.appendChild(songInfo);
                songElement.appendChild(unfavoriteButton);
                favoritesList.appendChild(songElement);
            });
        }

        // 启动应用
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
