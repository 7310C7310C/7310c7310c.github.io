<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数字华容道</title>
  <style>
    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
      background: rgba(233, 216, 195, 0.85);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* 毛玻璃背景 */
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
    }
    .top-bar {
      display: flex;
      align-items: center;
      margin: 32px 0 16px 0;
      gap: 16px;
      background: rgba(200, 182, 166, 0.7);
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(141, 103, 72, 0.08);
      padding: 12px 32px;
      backdrop-filter: blur(8px);
    }
    .difficulty-select {
      font-size: 1rem;
      padding: 4px 8px;
      background: #e9d8c3;
      color: #8d6748;
      border: 1px solid #a4907c;
      border-radius: 6px;
      outline: none;
      transition: border 0.2s;
    }
    .difficulty-select:focus {
      border: 1.5px solid #8d6748;
    }
    .restart-btn {
      font-size: 1rem;
      padding: 4px 20px;
      background: #a4907c;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 1px 4px rgba(141, 103, 72, 0.10);
    }
    .restart-btn:hover {
      background: #8d6748;
    }
    .puzzle-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      max-width: 100vw;
      flex: 1;
      /* 毛玻璃容器 */
      background: rgba(233, 216, 195, 0.45);
      border-radius: 24px;
      box-shadow: 0 4px 32px rgba(141, 103, 72, 0.10);
      margin-bottom: 32px;
      backdrop-filter: blur(8px);
      padding-bottom: 24px;
    }
    .puzzle {
      display: grid;
      background: rgba(200, 182, 166, 0.85);
      border-radius: 18px;
      box-shadow: 0 4px 24px rgba(141, 103, 72, 0.10);
      margin-bottom: 24px;
      transition: width 0.2s, height 0.2s;
      touch-action: none;
      user-select: none;
      border: 2.5px solid #a4907c;
      backdrop-filter: blur(6px);
    }
    .tile {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      background: linear-gradient(135deg, #e9d8c3 60%, #c8b6a6 100%);
      color: #8d6748;
      border-radius: 10px;
      margin: 4px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(141, 103, 72, 0.10);
      border: 1.5px solid #a4907c;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.18s cubic-bezier(0.4,0.2,0.2,1);
    }
    .tile:active {
      background: #c8b6a6;
      color: #fff;
    }
    .tile.empty {
      background: transparent;
      color: transparent;
      box-shadow: none;
      border: none;
      cursor: default;
    }
    .info-bar {
      display: flex;
      gap: 32px;
      font-size: 1.1rem;
      margin-bottom: 16px;
      color: #8d6748;
      justify-content: center;
      background: rgba(233, 216, 195, 0.7);
      border-radius: 10px;
      padding: 6px 24px;
      box-shadow: 0 1px 4px rgba(141, 103, 72, 0.06);
      backdrop-filter: blur(4px);
    }
    .record {
      margin-top: 8px;
      color: #388e3c;
      font-weight: bold;
      font-size: 1.1rem;
      text-align: center;
      background: rgba(233, 216, 195, 0.5);
      border-radius: 8px;
      padding: 4px 0;
      box-shadow: 0 1px 4px rgba(141, 103, 72, 0.04);
      backdrop-filter: blur(2px);
    }
    @media (max-width: 600px) {
      .puzzle {
        margin-bottom: 16px;
      }
      .info-bar {
        gap: 16px;
        font-size: 1rem;
      }
      .top-bar {
        margin: 16px 0 8px 0;
        padding: 8px 8px;
      }
      .puzzle-container {
        margin-bottom: 12px;
        padding-bottom: 8px;
      }
    }
    .modal-mask {
      position: fixed;
      z-index: 9999;
      left: 0; top: 0; right: 0; bottom: 0;
      background: rgba(200,182,166,0.45);
      backdrop-filter: blur(8px) saturate(120%);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }
    .modal-dialog {
      background: rgba(233,216,195,0.95);
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(141,103,72,0.18);
      padding: 32px 32px 20px 32px;
      min-width: 280px;
      max-width: 90vw;
      text-align: center;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .modal-content {
      color: #8d6748;
      font-size: 1.25rem;
      margin-bottom: 18px;
      line-height: 1.7;
    }
    .modal-actions {
      display: flex;
      gap: 18px;
      justify-content: center;
    }
    @media (max-width: 600px) {
      .modal-dialog {
        padding: 18px 6vw 12px 6vw;
        min-width: unset;
      }
      .modal-content {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <select class="difficulty-select" id="difficulty">
      <option value="3">3 × 3</option>
      <option value="4">4 × 4</option>
      <option value="5">5 × 5</option>
      <option value="6">6 × 6</option>
      <option value="7">7 × 7</option>
      <option value="8">8 × 8</option>
      <option value="9">9 × 9</option>
      <option value="10">10 × 10</option>
    </select>
    <button class="restart-btn" id="restart">重新开始</button>
  </div>
  <div class="puzzle-container">
    <div class="puzzle" id="puzzle"></div>
    <div class="info-bar">
      <span id="step">步数：0</span>
      <span id="time">时间：00:00</span>
    </div>
    <div class="record" id="record"></div>
  </div>
  <!-- 模态弹窗 -->
  <div class="modal-mask" id="modal-mask" style="display:none;">
    <div class="modal-dialog">
      <div class="modal-content" id="modal-content">
        <!-- 动态内容插入 -->
      </div>
      <div class="modal-actions">
        <button class="restart-btn" id="modal-restart">重新开始</button>
        <button class="restart-btn" id="modal-close">关闭</button>
      </div>
    </div>
  </div>
  <script>
    // 配置
    const DIFFICULTY_LIST = [3,4,5,6,7,8,9,10]; // 可自行修改
    const TILE_SIZE_BASE = 64; // 基础格子像素
    const TILE_SIZE_MIN = 32; // 最小格子像素
    const ANIMATION_DURATION = 120; // ms
    // 状态
    let size = 3;
    let board = [];
    let emptyIdx = 0;
    let step = 0;
    let timer = 0;
    let timerInterval = null;
    let startTime = null;
    let bestRecord = {};
    let isPlaying = false;
    let lastMove = null;
    let isAnimating = false;
    // 动画辅助：记录上一次board状态
    let prevBoard = null;
    // DOM
    const puzzleEl = document.getElementById('puzzle');
    const stepEl = document.getElementById('step');
    const timeEl = document.getElementById('time');
    const recordEl = document.getElementById('record');
    const diffEl = document.getElementById('difficulty');
    const restartBtn = document.getElementById('restart');
    // 本地存储key
    const STORAGE_KEY = 'number_puzzle_save';
    const RECORD_KEY = 'number_puzzle_record';
    // 模态弹窗相关
    const modalMask = document.getElementById('modal-mask');
    const modalContent = document.getElementById('modal-content');
    const modalRestart = document.getElementById('modal-restart');
    const modalClose = document.getElementById('modal-close');
    // 触摸滑动（跟手移动）
    let touchStartX=0, touchStartY=0, touchMoved=false, touchTile=null, touchIdx=null, dragDir=null, dragValid=false;
    let dragStartLeft=0, dragStartTop=0;
    let dragThreshold=32; // 拖动超过此距离才算有效
    // 工具函数
    function pad(n) { return n<10 ? '0'+n : n; }
    function getBestRecord(size) {
      if (!bestRecord[size]) return null;
      return bestRecord[size];
    }
    function setBestRecord(size, step, time) {
      if (!bestRecord[size] || step < bestRecord[size].step || (step === bestRecord[size].step && time < bestRecord[size].time)) {
        bestRecord[size] = {step, time};
        localStorage.setItem(RECORD_KEY, JSON.stringify(bestRecord));
      }
    }
    function loadBestRecord() {
      try {
        bestRecord = JSON.parse(localStorage.getItem(RECORD_KEY)||'{}');
      } catch { bestRecord = {}; }
    }
    function saveGame() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({size, board, step, timer, startTime, isPlaying}));
    }
    function loadGame() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!data) return null;
        return data;
      } catch { return null; }
    }
    function clearGame() {
      localStorage.removeItem(STORAGE_KEY);
    }
    // 生成目标数组
    function getGoal(size) {
      const arr = [];
      for(let i=1;i<size*size;i++) arr.push(i);
      arr.push(0);
      return arr;
    }
    // 判断可解性
    function isSolvable(arr, size) {
      let inv = 0;
      for(let i=0;i<arr.length;i++) {
        if(arr[i]===0) continue;
        for(let j=i+1;j<arr.length;j++) {
          if(arr[j]!==0 && arr[i]>arr[j]) inv++;
        }
      }
      if(size%2===1) return inv%2===0;
      const row = Math.floor(arr.indexOf(0)/size);
      return (inv + size - row)%2===0;
    }
    // 打乱
    function shuffle(size) {
      let arr = getGoal(size);
      do {
        for(let i=arr.length-1;i>0;i--) {
          const j = Math.floor(Math.random()*(i+1));
          [arr[i],arr[j]] = [arr[j],arr[i]];
        }
      } while(!isSolvable(arr, size) || isGoal(arr));
      return arr;
    }
    // 判断完成
    function isGoal(arr) {
      for(let i=0;i<arr.length-1;i++) if(arr[i]!==i+1) return false;
      return arr[arr.length-1]===0;
    }
    // 渲染
    function render() {
      // 计算格子大小
      let tileSize = Math.max(TILE_SIZE_MIN, Math.min(TILE_SIZE_BASE, Math.floor((window.innerWidth-32)/size), Math.floor((window.innerHeight-220)/size)));
      puzzleEl.style.gridTemplateColumns = `repeat(${size}, ${tileSize}px)`;
      puzzleEl.style.gridTemplateRows = `repeat(${size}, ${tileSize}px)`;
      puzzleEl.style.width = `${tileSize*size}px`;
      puzzleEl.style.height = `${tileSize*size}px`;
      puzzleEl.innerHTML = '';
      // 动画：绝对定位
      puzzleEl.style.position = 'relative';
      board.forEach((num, idx) => {
        const tile = document.createElement('div');
        tile.className = 'tile' + (num===0?' empty':'');
        tile.style.width = tile.style.height = tileSize+'px';
        if(num!==0) tile.textContent = num;
        tile.dataset.idx = idx;
        // 动画定位
        if(num!==0) {
          tile.style.position = 'absolute';
          const x = idx%size, y = Math.floor(idx/size);
          tile.style.left = (x*tileSize)+'px';
          tile.style.top = (y*tileSize)+'px';
          tile.style.transition = 'left 0.18s cubic-bezier(0.4,0.2,0.2,1), top 0.18s cubic-bezier(0.4,0.2,0.2,1)';
        }
        puzzleEl.appendChild(tile);
      });
      stepEl.textContent = `步数：${step}`;
      timeEl.textContent = `时间：${pad(Math.floor(timer/60))}:${pad(timer%60)}`;
      // 纪录
      const rec = getBestRecord(size);
      if(isGoal(board)) {
        if(rec) {
          recordEl.innerHTML = `成功！<br>本次：${step}步 ${pad(Math.floor(timer/60))}:${pad(timer%60)}<br>最佳：${rec.step}步 ${pad(Math.floor(rec.time/60))}:${pad(rec.time%60)}`;
        } else {
          recordEl.innerHTML = `成功！<br>本次：${step}步 ${pad(Math.floor(timer/60))}:${pad(timer%60)}<br>已成为最佳纪录！`;
        }
      } else {
        if(rec) {
          recordEl.textContent = `最佳纪录：${rec.step}步 ${pad(Math.floor(rec.time/60))}:${pad(rec.time%60)}`;
        } else {
          recordEl.textContent = '';
        }
      }
    }
    // 计时
    function startTimer() {
      if(timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timer = Math.floor((Date.now()-startTime)/1000);
        render();
      }, 1000);
    }
    function stopTimer() {
      if(timerInterval) clearInterval(timerInterval);
      timerInterval = null;
    }
    // 移动
    function canMove(idx) {
      const x = idx%size, y = Math.floor(idx/size);
      const ex = emptyIdx%size, ey = Math.floor(emptyIdx/size);
      return (Math.abs(x-ex)+Math.abs(y-ey))===1;
    }
    function move(idx, animate=true) {
      if(isAnimating || !canMove(idx) || isGoal(board)) return;
      isAnimating = true;
      // 移除动画逻辑，直接交换
      swap(idx, emptyIdx);
      isAnimating = false;
      render();
      afterMove();
    }
    function swap(i, j) {
      [board[i], board[j]] = [board[j], board[i]];
      emptyIdx = i;
    }
    function afterMove() {
      step++;
      saveGame();
      render();
      if(isGoal(board)) {
        stopTimer();
        setBestRecord(size, step, timer);
        clearGame();
        render();
        // 弹出模态
        const rec = getBestRecord(size);
        let html = `<div style='font-size:1.4em;font-weight:bold;margin-bottom:8px;'>🎉 恭喜完成！</div>`;
        html += `本次：<b>${step}</b> 步 <b>${pad(Math.floor(timer/60))}:${pad(timer%60)}</b><br>`;
        if(rec) {
          html += `最佳纪录：<b>${rec.step}</b> 步 <b>${pad(Math.floor(rec.time/60))}:${pad(rec.time%60)}</b>`;
        } else {
          html += `已成为最佳纪录！`;
        }
        showModal(html);
        return;
      }
    }
    // 事件
    puzzleEl.addEventListener('click', e => {
      if(!isPlaying || isAnimating) return;
      const tile = e.target.closest('.tile');
      if(!tile || tile.classList.contains('empty')) return;
      const idx = +tile.dataset.idx;
      move(idx);
    });
    // 方向键/wasd
    document.addEventListener('keydown', e => {
      if(!isPlaying || isAnimating || isGoal(board)) return;
      let dir = null;
      if(['ArrowUp','w','W'].includes(e.key)) dir = 'up';
      if(['ArrowDown','s','S'].includes(e.key)) dir = 'down';
      if(['ArrowLeft','a','A'].includes(e.key)) dir = 'left';
      if(['ArrowRight','d','D'].includes(e.key)) dir = 'right';
      if(!dir) return;
      e.preventDefault();
      let ex = emptyIdx%size, ey = Math.floor(emptyIdx/size);
      let nx = ex, ny = ey;
      if(dir==='up') ny++;
      if(dir==='down') ny--;
      if(dir==='left') nx++;
      if(dir==='right') nx--;
      if(nx<0||nx>=size||ny<0||ny>=size) return;
      const idx = ny*size+nx;
      move(idx);
    });
    // 触摸滑动（跟手移动）
    puzzleEl.addEventListener('touchstart', e => {
      if(!isPlaying || isAnimating) return;
      if(e.touches.length!==1) return;
      const touch = e.touches[0];
      const target = document.elementFromPoint(touch.clientX, touch.clientY);
      if(!target || !target.classList.contains('tile') || target.classList.contains('empty')) return;
      const idx = +target.dataset.idx;
      if(!canMove(idx)) return;
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
      touchMoved = false;
      touchTile = target;
      touchIdx = idx;
      dragDir = null;
      dragValid = false;
      // 记录初始位置
      dragStartLeft = parseFloat(touchTile.style.left);
      dragStartTop = parseFloat(touchTile.style.top);
      // 提高层级
      touchTile.style.zIndex = 10;
    });
    puzzleEl.addEventListener('touchmove', e => {
      if(!isPlaying || isAnimating || !touchTile) return;
      const touch = e.touches[0];
      const dx = touch.clientX - touchStartX;
      const dy = touch.clientY - touchStartY;
      if(!touchMoved && Math.abs(dx)+Math.abs(dy)>8) touchMoved = true;
      if(!touchMoved) return;
      // 只允许单方向拖动
      if(!dragDir) {
        if(Math.abs(dx)>Math.abs(dy)) dragDir = 'x';
        else dragDir = 'y';
      }
      let move = 0;
      let maxMove = 0;
      if(dragDir==='x') {
        move = dx;
        // 只能左右移动且不能超越空格
        const ex = emptyIdx%size, tx = touchIdx%size;
        if(ex>tx) maxMove = (ex-tx)*parseFloat(touchTile.style.width);
        else maxMove = (ex-tx)*parseFloat(touchTile.style.width);
        if((ex>tx && move>maxMove) || (ex<tx && move<maxMove)) move = maxMove;
        if((ex>tx && move<0) || (ex<tx && move>0)) move = 0;
        touchTile.style.transform = `translateX(${move}px)`;
        dragValid = Math.abs(move) > dragThreshold;
      } else {
        move = dy;
        // 只能上下移动且不能超越空格
        const ey = Math.floor(emptyIdx/size), ty = Math.floor(touchIdx/size);
        if(ey>ty) maxMove = (ey-ty)*parseFloat(touchTile.style.height);
        else maxMove = (ey-ty)*parseFloat(touchTile.style.height);
        if((ey>ty && move>maxMove) || (ey<ty && move<maxMove)) move = maxMove;
        if((ey>ty && move<0) || (ey<ty && move>0)) move = 0;
        touchTile.style.transform = `translateY(${move}px)`;
        dragValid = Math.abs(move) > dragThreshold;
      }
      e.preventDefault();
    });
    puzzleEl.addEventListener('touchend', e => {
      if(!isPlaying || isAnimating || !touchTile) return;
      // 判断是否有效拖动
      if(dragValid) {
        move(touchIdx);
      } else {
        // 回弹
        touchTile.style.transition = 'transform 0.18s';
        touchTile.style.transform = 'none';
        setTimeout(()=>{
          if(touchTile) touchTile.style.transition = '';
        }, 200);
      }
      // 恢复
      if(touchTile) touchTile.style.zIndex = '';
      touchTile = null;
      touchIdx = null;
      dragDir = null;
      dragValid = false;
    });
    // 难度切换
    diffEl.addEventListener('change', e => {
      size = +diffEl.value;
      startNewGame();
    });
    // 重新开始
    restartBtn.addEventListener('click', () => {
      startNewGame();
    });
    // 新游戏
    function startNewGame() {
      stopTimer();
      board = shuffle(size);
      emptyIdx = board.indexOf(0);
      step = 0;
      timer = 0;
      startTime = Date.now();
      isPlaying = true;
      saveGame();
      render();
      startTimer();
    }
    // 恢复游戏
    function resumeGame(data) {
      size = data.size;
      board = data.board;
      emptyIdx = board.indexOf(0);
      step = data.step;
      timer = data.timer;
      startTime = data.startTime ? Date.now()-(timer*1000) : Date.now();
      isPlaying = data.isPlaying;
      diffEl.value = size;
      render();
      startTimer();
    }
    // 新增：继续上次游戏模态
    function showResumeModal(onContinue, onRestart) {
      const html = `<div style='font-size:1.2em;font-weight:bold;margin-bottom:10px;'>检测到上次未完成的游戏</div>是否继续？`;
      modalContent.innerHTML = html;
      // 动态生成按钮
      const actions = document.createElement('div');
      actions.className = 'modal-actions';
      const btnContinue = document.createElement('button');
      btnContinue.className = 'restart-btn';
      btnContinue.textContent = '继续游戏';
      const btnRestart = document.createElement('button');
      btnRestart.className = 'restart-btn';
      btnRestart.textContent = '重新开始';
      actions.appendChild(btnContinue);
      actions.appendChild(btnRestart);
      // 清空原有actions，插入新actions
      const modalActions = modalContent.parentElement.querySelector('.modal-actions');
      if(modalActions) modalActions.replaceWith(actions);
      else modalContent.parentElement.appendChild(actions);
      modalMask.style.display = 'flex';
      btnContinue.onclick = function() {
        hideModal();
        onContinue && onContinue();
      };
      btnRestart.onclick = function() {
        hideModal();
        onRestart && onRestart();
      };
    }
    // 修改init内相关逻辑
    function init() {
      loadBestRecord();
      // 填充难度选项
      diffEl.innerHTML = DIFFICULTY_LIST.map(n=>`<option value="${n}">${n} × ${n}</option>`).join('');
      // 检查本地存档
      const data = loadGame();
      if(data && !isGoal(data.board)) {
        showResumeModal(() => {
          resumeGame(data);
        }, () => {
          clearGame();
          size = DIFFICULTY_LIST[0];
          diffEl.value = size;
          startNewGame();
        });
        return;
      }
      size = DIFFICULTY_LIST[0];
      diffEl.value = size;
      startNewGame();
    }
    window.addEventListener('resize', render);
    init();
    // 模态弹窗相关
    function showModal(html) {
      modalContent.innerHTML = html;
      modalMask.style.display = 'flex';
    }
    function hideModal() {
      modalMask.style.display = 'none';
    }
    modalRestart.onclick = function() {
      hideModal();
      startNewGame();
    };
    modalClose.onclick = function() {
      hideModal();
    };
  </script>
</body>
